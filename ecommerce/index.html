<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B1A; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#F472B6;
  --lime:#4ADE80; --red:#FB7185; --gold:#FBBF24;
  --grad:linear-gradient(100deg,#22D3EE,#8B5CF6,#F472B6);
  --glass:rgba(255,255,255,.05); --glass-brd:rgba(255,255,255,.12);
  --ink:#E7ECFF; --muted:#9AA6C9; --spring:cubic-bezier(.22,1.4,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s var(--spring) infinite alternate}
.orb.a{width:520px;height:520px;background:#1e3a8a;top:-160px;left:-120px}
.orb.b{width:460px;height:460px;background:#6d28d9;bottom:-180px;right:-100px;animation-duration:32s}
.orb.c{width:380px;height:380px;background:#0e7490;top:40%;left:55%;animation-duration:29s}
.orb.d{width:300px;height:300px;background:#be185d;top:12%;right:18%;animation-duration:35s;opacity:.35}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
.grid-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(139,92,246,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.09) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%)}
/* ===== header w/ game HUD ===== */
header{position:sticky;top:0;z-index:50;padding:2px;margin:12px;border-radius:20px;background:var(--grad);background-size:300% 300%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.hdr-in{background:rgba(9,13,28,.88);backdrop-filter:blur(14px);border-radius:18px;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:180px}
.brand .k{font-size:11px;letter-spacing:.26em;color:var(--cyan);font-weight:600}
.brand .t{font-size:18px;font-weight:700}
.brand .s{font-size:11px;color:var(--muted)}
.hud{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:170px}
.lvl .top{display:flex;justify-content:space-between;font-size:11px}
.lvl .top .ti{font-weight:700;color:#fff}
.lvl .top .xp{font-family:'JetBrains Mono',monospace;color:var(--gold)}
.lvl .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
.lvl .bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
@keyframes shim{to{background-position:200% 0}}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:12px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;transition:.3s}
.chip.streak{color:var(--gold)}
.chip.streak.t1{border-color:rgba(251,191,36,.45);box-shadow:0 0 14px rgba(251,191,36,.22)}
.chip.streak.t2{border-color:rgba(251,146,60,.7);box-shadow:0 0 20px rgba(251,146,60,.38);color:#FDBA74}
.chip.streak.t3{border-color:rgba(244,114,182,.85);box-shadow:0 0 28px rgba(244,114,182,.5);color:#FBCFE8;animation:pulseHot 1.1s ease-in-out infinite alternate}
@keyframes pulseHot{to{transform:scale(1.07)}}
.chip.badge,.chip.snd{cursor:pointer}
.chip.badge{color:var(--cyan)}
.chip.snd{color:var(--pink)}
.chip.cmap{color:var(--lime);cursor:pointer}
.chip.cmap:hover{border-color:rgba(74,222,128,.6)}
.chip.snd.off{color:var(--muted);opacity:.65}
.chip .lab{font-size:10px;letter-spacing:.12em;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600}
/* ===== layout ===== */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:6px 18px 96px;max-width:1320px;margin:0 auto}
aside{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 124px);overflow-y:auto;padding-right:4px}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:6px}
.side-h{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:4px 0 10px 6px}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 6px 16px}
.pbar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
.topic{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:7px;border-radius:13px;background:var(--glass);border:1px solid transparent;cursor:pointer;transition:.25s;font-size:13.5px}
.topic:hover{border-color:var(--glass-brd);transform:translateX(3px)}
.topic .idx{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.topic.done .idx{background:var(--grad);color:#08111f}
.topic .nm{flex:1;line-height:1.2;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic .nm small{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.topic .flame{font-style:normal;font-size:12px}
.topic .sc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--cyan)}
.topic.done{border-color:rgba(74,222,128,.34)}
.topic.hot{border-color:rgba(251,191,36,.3)}
main{min-width:0}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;padding:26px 28px;backdrop-filter:blur(10px);margin-bottom:18px;animation:popIn .5s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:6px}
h1.tt{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
.sub b{color:#D6DDF7}
.srcrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.src{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 11px;border-radius:999px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.45);color:#d6ccff}
.watch{margin-top:14px;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.45);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px}
.watch h5{margin:0 0 4px;color:var(--red);font-size:14px} .watch p{margin:0;font-size:13.5px;color:#ffd9e0;line-height:1.5}
/* ===== buttons / mcq ===== */
.btn{border:0;font-family:inherit;font-weight:600;cursor:pointer;border-radius:12px;transition:.25s;font-size:14px}
.btn-grad{background:var(--grad);background-size:200% auto;color:#08111f;padding:12px 24px;box-shadow:0 6px 24px rgba(139,92,246,.35)}
.btn-grad:hover{background-position:100% center;transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);color:var(--ink);padding:11px 20px}
.btn-ghost:hover{border-color:var(--cyan);color:#fff}
.row-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.mcq{margin-top:8px}.mcq .q{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5}
.mcq .q b{color:#fff}
.givens{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.givens span{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 9px;border-radius:8px;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.28);color:#bfe9f4}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.05em;padding:3px 10px;border-radius:999px;margin:0 6px 10px 0}
.tag.concept{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
.tag.apply{background:rgba(251,191,36,.14);color:var(--gold);border:1px solid rgba(251,191,36,.4)}
.tag.calc{background:rgba(74,222,128,.14);color:var(--lime);border:1px solid rgba(74,222,128,.45)}
.tag.case{background:rgba(244,114,182,.16);color:var(--pink);border:1px solid rgba(244,114,182,.5)}
.tag.easy{background:rgba(74,222,128,.13);color:var(--lime)}.tag.medium{background:rgba(251,191,36,.13);color:var(--gold)}.tag.hard{background:rgba(251,113,133,.13);color:var(--red)}
.tag.trap{background:rgba(139,92,246,.2);color:#ddd0ff;border:1px solid rgba(139,92,246,.6);animation:trapGlow 2.2s ease-in-out infinite alternate}
@keyframes trapGlow{to{box-shadow:0 0 14px rgba(139,92,246,.55)}}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;position:relative;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}.opt:disabled{cursor:default}
.opt .lt{font-family:'JetBrains Mono',monospace;color:var(--violet);font-weight:700;margin-right:10px}
.opt.correct{border-color:var(--lime);background:rgba(74,222,128,.16);box-shadow:0 0 34px rgba(74,222,128,.4);animation:popBig .6s var(--spring)}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.2);box-shadow:0 0 34px rgba(251,113,133,.4);animation:shakeHard .55s}.opt.dim{opacity:.32}
@keyframes popBig{0%{transform:scale(1)}30%{transform:scale(1.075)}55%{transform:scale(.99)}75%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakeHard{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-14px) rotate(-1.4deg)}26%{transform:translateX(14px) rotate(1.4deg)}42%{transform:translateX(-11px) rotate(-1deg)}58%{transform:translateX(11px) rotate(1deg)}74%{transform:translateX(-6px)}88%{transform:translateX(6px)}}
.why{margin-top:14px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:14px 16px;opacity:0;transform:translateY(8px);transition:.4s;max-height:0;overflow:hidden}
.why.show{opacity:1;transform:none;max-height:900px}
.why h5{margin:0 0 4px;color:var(--gold);font-size:13px}.why p{margin:0 0 8px;font-size:13.5px;color:#ffeec4;line-height:1.6}
.why p:last-child{margin-bottom:0}
.why .work{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#ffe0a3;background:rgba(0,0,0,.28);border-radius:8px;padding:9px 11px;margin:8px 0;line-height:1.7;overflow-x:auto;white-space:pre-wrap}
.floater{position:fixed;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;pointer-events:none;z-index:999;text-shadow:0 3px 14px rgba(0,0,0,.6);animation:rise 1.25s var(--spring) forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-110px) scale(1.6)}}
/* ===== BIG REACTION TEXT ===== */
.bigcall{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:1000;pointer-events:none;font-weight:700;
  font-size:clamp(38px,9vw,86px);letter-spacing:-.01em;text-align:center;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:callIn 1.6s var(--spring) forwards;filter:drop-shadow(0 0 32px rgba(139,92,246,.75))}
.bigcall.bad{background:linear-gradient(100deg,#FB7185,#F43F5E,#FDA4AF);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 34px rgba(251,113,133,.8));animation:callBad 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes callIn{0%{opacity:0;transform:translateX(-50%) scale(.25) rotate(-9deg)}
  18%{opacity:1;transform:translateX(-50%) scale(1.28) rotate(3deg)}
  32%{transform:translateX(-50%) scale(1) rotate(-1.5deg)}
  44%{transform:translateX(-50%) scale(1.1) rotate(0deg)}
  80%{opacity:1;transform:translateX(-50%) scale(1.02)}
  100%{opacity:0;transform:translateX(-50%) scale(1.14) translateY(-46px)}}
@keyframes callBad{0%{opacity:0;transform:translateX(-50%) scale(2.2) rotate(6deg)}
  16%{opacity:1;transform:translateX(-50%) scale(.9) rotate(-4deg)}
  26%{transform:translateX(-50%) scale(1.12) rotate(3deg)}
  38%{transform:translateX(-50%) scale(.98) rotate(-2deg)}
  50%{transform:translateX(-50%) scale(1.04) rotate(0deg)}
  82%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.86) translateY(34px)}}
/* ===== GIANT STAMPS — the exaggerated reaction ===== */
.mega{position:fixed;left:50%;top:47%;z-index:999;pointer-events:none;user-select:none;line-height:1;
  font-size:clamp(150px,33vw,330px);filter:drop-shadow(0 22px 48px rgba(0,0,0,.75))}
.mega.down{animation:megaDown 1.5s cubic-bezier(.18,.85,.3,1) forwards}
@keyframes megaDown{
  0%{opacity:0;transform:translate(-50%,-160%) scale(.35) rotate(-42deg)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.42) rotate(9deg)}
  25%{transform:translate(-50%,-50%) scale(1.02) rotate(-7deg)}
  36%{transform:translate(-50%,-50%) scale(1.24) rotate(5deg)}
  47%{transform:translate(-50%,-50%) scale(1.08) rotate(-3deg)}
  58%{transform:translate(-50%,-50%) scale(1.15) rotate(0deg)}
  78%{opacity:.95;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,26%) scale(.82) rotate(17deg)}}
.mega.up{animation:megaUp 1.25s cubic-bezier(.2,1.35,.35,1) forwards}
@keyframes megaUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-16deg)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(7deg)}
  34%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
  48%{transform:translate(-50%,-50%) scale(1.14) rotate(0deg)}
  72%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-130%) scale(1.3) rotate(6deg)}}
/* ===== flashes / vignettes ===== */
.flash{position:fixed;inset:0;z-index:997;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.34),transparent 62%);animation:flashF .55s ease-out forwards}
@keyframes flashF{to{opacity:0}}
.greenflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(74,222,128,.30),transparent 64%);animation:flashF .6s ease-out forwards}
.redflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(251,113,133,.34),transparent 58%);animation:flashF .7s ease-out forwards}
.vignette{position:fixed;inset:0;z-index:996;pointer-events:none;box-shadow:inset 0 0 190px 60px rgba(244,63,94,.75);animation:vig .95s ease-out forwards}
@keyframes vig{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.vignette.good{box-shadow:inset 0 0 180px 54px rgba(74,222,128,.62);animation-duration:.85s}
.shakeit{animation:bodyShake .48s}
@keyframes bodyShake{0%,100%{transform:translate(0,0)}12%{transform:translate(-13px,4px) rotate(-.5deg)}26%{transform:translate(13px,-4px) rotate(.5deg)}40%{transform:translate(-10px,3px)}54%{transform:translate(10px,-3px)}68%{transform:translate(-6px,2px)}84%{transform:translate(6px,-2px)}}
.zoomit{animation:bodyZoom .5s var(--spring)}
@keyframes bodyZoom{0%,100%{transform:scale(1)}35%{transform:scale(1.014)}}
/* ===== crackers ===== */
.spark{position:fixed;z-index:998;pointer-events:none;animation:crkX var(--d) linear forwards}
.spark i{display:block;border-radius:50%;animation:crkY var(--d) cubic-bezier(.14,.72,.36,1) forwards, crkF var(--d) ease-in forwards}
@keyframes crkX{from{transform:translateX(0)}to{transform:translateX(var(--tx))}}
@keyframes crkY{0%{transform:translateY(0)}58%{transform:translateY(var(--ty))}100%{transform:translateY(calc(var(--ty) + 96px))}}
@keyframes crkF{0%,55%{opacity:1}100%{opacity:0}}
.boom{position:fixed;z-index:998;pointer-events:none;border:3px solid #fff;border-radius:50%;margin:0;animation:crkR .68s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes crkR{from{transform:translate(-50%,-50%) scale(.05);opacity:.98}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.rocket{position:fixed;z-index:998;pointer-events:none;width:4px;height:16px;border-radius:3px;margin-left:-2px;animation:crkL var(--rd) cubic-bezier(.25,.5,.4,1) forwards}
@keyframes crkL{from{transform:translateY(0) scaleY(1.35);opacity:.15}60%{opacity:1}to{transform:translateY(var(--ry)) scaleY(.7);opacity:.85}}
/* ===== thumbs — the shower ===== */
.tdown{position:fixed;z-index:998;pointer-events:none;user-select:none;line-height:1;filter:drop-shadow(0 3px 9px rgba(0,0,0,.6))}
.tdown.pop{animation:tdPop var(--d) cubic-bezier(.2,.7,.35,1) forwards}
@keyframes tdPop{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.25)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1.25)}}
.tdown.rain{animation:tdRain var(--d) linear forwards}
@keyframes tdRain{0%{opacity:0;transform:translateY(-40px) rotate(0deg)}
  9%{opacity:1}
  86%{opacity:1}
  100%{opacity:0;transform:translateY(var(--ty)) rotate(var(--rot))}}
.confetti{position:fixed;width:11px;height:15px;top:-20px;z-index:998;pointer-events:none;border-radius:2px}
/* ===== toast ===== */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160px);z-index:1001;background:rgba(9,13,28,.95);border:1px solid var(--gold);border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .5s var(--spring);max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .em{font-size:26px}.toast .tt{font-weight:700}.toast .td{font-size:12px;color:var(--muted)}
/* ===== quiz ===== */
.qgroup-h{display:flex;align-items:center;gap:12px;margin:26px 2px 12px;scroll-margin-top:110px}
.qgroup-h .gi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--grad);color:#08111f;font-size:13px}
.qgroup-h .gt{font-size:17px;font-weight:700}.qgroup-h .gc{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.qcard{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:20px 22px;margin-bottom:14px;backdrop-filter:blur(8px);transition:box-shadow .35s,border-color .35s}
.qcard.hitgood{border-color:rgba(74,222,128,.55);box-shadow:0 0 40px rgba(74,222,128,.22)}
.qcard.hitbad{border-color:rgba(251,113,133,.55);box-shadow:0 0 40px rgba(251,113,133,.22)}
.qnum{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.footbar{position:fixed;bottom:0;left:0;right:0;z-index:60;padding:10px 18px;background:rgba(9,13,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-brd);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.footbar .fp{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px}
.footbar .fp .lbl{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.footbar .fp .bar{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.footbar .fp .bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--grad);transition:width .5s var(--spring)}
.ring-wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:200px;height:200px}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .big{font-size:44px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ring .mid .sm{font-size:12px;color:var(--muted);letter-spacing:.1em}
.grade{font-size:24px;font-weight:700;margin:4px 0}
.meters{margin-top:24px;display:grid;gap:12px}

/* scope switch + focus states on the section list */

/* ===== mode toggle ===== */

.lstep{margin:0 0 16px;animation:popIn .45s var(--spring) both}

  border-radius:14px;padding:16px 18px;margin:22px 2px 12px;animation:popIn .45s var(--spring) both}

/* ===== written paper ===== */
.pq{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:20px 22px;margin-bottom:16px;backdrop-filter:blur(8px)}

.ans .rub h6{margin:0 0 5px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ans .rub ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:#ffeec4}

/* ===== supply & demand diagram ===== */
.dsg{margin:12px 0 4px;background:rgba(0,0,0,.26);border:1px solid var(--glass-brd);border-radius:13px;padding:12px;overflow-x:auto}
.dsg svg{display:block;margin:0 auto;max-width:100%;height:auto}
.dsg .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:7px;line-height:1.5}
/* ===== exam-day panel ===== */
.plan{display:grid;gap:11px;margin-top:14px}
.pstep{display:flex;gap:13px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);
  border-radius:13px;padding:13px 15px}
.pstep .pi{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--grad);
  color:#08111f;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px}
.pstep .pt{font-size:14px;line-height:1.55;color:#D6DDF7}
.pstep .pt b{color:#fff}
/* mode toggle gets a third button — let it wrap on small screens */
.mtog{flex-wrap:wrap}
@media(max-width:620px){.mtog button{padding:6px 9px;font-size:11.5px}}

/* =========================================================================
   SLIMMER HEADER + THE MAP BUTTON
   The map is the single most useful thing in the app, so it gets a real
   button of its own between the title and the mode toggle — never a chip
   in the HUD, and never label-less on a phone. Everything else in the bar
   loses a few pixels to pay for it.
   ========================================================================= */
header{margin:8px;border-radius:16px;padding:2px}
.hdr-in{padding:7px 12px;gap:10px 12px;border-radius:14px}
.brand{min-width:0;flex:0 1 auto;line-height:1.15}
.brand .k{font-size:9px;letter-spacing:.2em}

/* the map button itself */
.mapbtn{display:flex;align-items:center;gap:9px;cursor:pointer;border:0;font-family:inherit;
  padding:8px 16px 8px 13px;border-radius:13px;color:#08111f;
  background:var(--grad);background-size:220% auto;
  box-shadow:0 5px 20px rgba(139,92,246,.45);transition:.25s var(--spring);
  animation:mapPulse 2.6s ease-in-out infinite}
.mapbtn:hover{background-position:100% center;transform:translateY(-2px) scale(1.04);
  box-shadow:0 9px 30px rgba(139,92,246,.65);animation:none}
.mapbtn:active{transform:translateY(0) scale(.98)}
.mapbtn .mi{font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.mapbtn .mt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}

.mapbtn .mt small{font-size:9.5px;font-weight:600;opacity:.72;letter-spacing:.04em}
@keyframes mapPulse{
  0%,100%{box-shadow:0 5px 20px rgba(139,92,246,.45)}
  50%{box-shadow:0 5px 26px rgba(34,211,238,.75),0 0 0 4px rgba(34,211,238,.16)}}

}
/* =========================================================================
   EXAM-PATTERN LAYER — caselets with data tables, and written answers.
   The real End Term paper hands you a table and asks you to read it, so the
   table has to look like a table, not like prose.
   ========================================================================= */
.caselet{background:rgba(244,114,182,.07);border:1px solid rgba(244,114,182,.4);border-left:4px solid var(--pink);
  border-radius:16px;padding:18px 20px;margin:26px 2px 14px;animation:popIn .45s var(--spring) both;scroll-margin-top:86px}

.caselet h4{margin:5px 0 9px;font-size:17px;color:#fff}
.caselet .brief{font-size:13.8px;line-height:1.62;color:#F5D9E6}
.caselet .brief b{color:#fff}
.caselet .brief p{margin:0 0 7px}
.caselet .brief p:last-child{margin-bottom:0}
.caselet .facts{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 0}
.caselet .facts span{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:5px 10px;border-radius:9px;
  background:rgba(0,0,0,.3);border:1px solid rgba(244,114,182,.35);color:#ffd9ea}
/* data tables */
.dtab{margin:14px 0 0}
.dtab .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:700;margin:0 0 7px}
.dtab .sc{overflow-x:auto;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(0,0,0,.28)}

.dtab th{background:rgba(255,255,255,.07);color:var(--cyan);text-align:left;padding:9px 12px;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:700;white-space:nowrap;font-family:'Space Grotesk',sans-serif}
.dtab td{padding:8px 12px;border-top:1px solid rgba(255,255,255,.08);color:#E7ECFF;white-space:nowrap}
.dtab tr td:first-child{color:#fff;font-weight:700;font-family:'Space Grotesk',sans-serif}
.dtab tr:hover td{background:rgba(255,255,255,.035)}
.dtab td.num{text-align:right}
/* written (open-ended) questions */
.openq{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.42);border-radius:16px;padding:20px 22px;margin-bottom:14px}
.openq .oh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.openq .on{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.openq .om{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:3px 10px;border-radius:999px;
  background:rgba(251,191,36,.15);color:var(--gold);border:1px solid rgba(251,191,36,.45);margin-left:auto}
.openq .oq{font-size:15.5px;line-height:1.6;color:#fff;font-weight:600}
.openq .hint{font-size:12.5px;color:var(--muted);margin:9px 0 0;line-height:1.55}
@media(max-width:620px){
  .caselet{padding:14px 14px;margin:20px 0 12px}
  .dtab table{font-size:11.5px;min-width:380px}

<div class="bg-fx"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="orb d"></div></div>

      <span class="t">E-commerce<span class="tagline"> · Sessions 1–6</span></span>
    </div>
    <button class="mapbtn" id="hMap" title="The Map — the whole course on one page">
      <span class="mi">📋</span>
      <span class="mt"><b>THE MAP</b><small>full cheat-sheet</small></span>
    </button>
    <div class="mtog" id="mTog"></div>

        <div class="top"><span class="ti" id="hLvl">Intern</span><span class="xp" id="hXp">0 XP</span></div>

<script>
/* =========================================================================
   E-commerce — built on the reusable quiz template
   ~/projects/quiz-template · see SPEC.md for the authoring rules

   Modules switch on automatically from the data that exists:
     CASES   → ✍ Exam Paper     (caselets + data tables + written answers)
     QUIZ    → ⚙ Practice Quiz  (standalone MCQ bank, needs TOPICS)
     LESSONS → ◈ Prep Material  (lessons + live calculators, needs TOPICS)
     PAPER   → ✎ Written Paper  (long-form questions + model answers)
     CMAP    → 📋 THE MAP        (cheat-sheet overlay)
   ========================================================================= */
/* ---------- tiny helpers, loaded before everything else ---------- */
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* =========================================================================
   SOUND — synthesised with WebAudio, no files, no network.
   The context is created lazily on the first click, which satisfies autoplay.

let AC=null, SOUND=true;
try{ if(localStorage.getItem('quiz_sound')==='0') SOUND=false; }catch(e){}
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq,at,dur,type,vol,glideTo){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(at,dur,vol,freq){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at, n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
  const g=c.createGain(); g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}
/* correct — a major arpeggio that climbs higher the longer the streak runs */
function sfxRight(streak){
  if(!SOUND) return;
  const base=523.25*Math.pow(2,Math.min(4,Math.floor((streak-1)/4))/12*2);
  const notes=[1,1.26,1.5,2];                         // root, M3, P5, octave
  notes.forEach((m,i)=>tone(base*m,i*0.055,0.26,'triangle',0.17));
  if(streak>=3) tone(base*2.52,0.235,0.34,'sine',0.13);
  if(streak>=7){ tone(base*3,0.30,0.4,'sine',0.11); noise(0,0.16,0.09,2600); }
  if(streak>=12){ [0,.09,.18].forEach((t,i)=>tone(base*(3+i*0.5),0.34+t,0.3,'triangle',0.09)); }
}
/* wrong — a fat descending buzzer plus a thud */
function sfxWrong(){
  if(!SOUND) return;
  tone(196,0,0.42,'sawtooth',0.20,72);
  tone(146.8,0.03,0.46,'square',0.13,58);
  noise(0,0.28,0.26,420);
  tone(92,0.16,0.3,'sine',0.16,46);
}
function sfxBadge(){ if(!SOUND) return; [784,988,1175,1568].forEach((f,i)=>tone(f,i*0.075,0.3,'triangle',0.15)); }
function sfxLevel(){ if(!SOUND) return; [392,523,659,784,1047].forEach((f,i)=>tone(f,i*0.07,0.34,'sine',0.16)); }
function sfxFanfare(){ if(!SOUND) return;
  [[523,0],[659,.1],[784,.2],[1047,.3],[784,.46],[1047,.56],[1319,.66]].forEach(([f,t])=>tone(f,t,0.5,'triangle',0.16));
  noise(0.3,0.5,0.08,3200); }
function sfxSad(){ if(!SOUND) return; [440,392,349,294].forEach((f,i)=>tone(f,i*0.16,0.4,'triangle',0.15)); }

/* ---------------- HUD ---------------- */
function levelInfo(){let idx=0;for(let i=0;i<LV.length;i++)if(G.xp>=LV[i].xp)idx=i;
  const cur=LV[idx], nxt=LV[idx+1];
  const pct=nxt?((G.xp-cur.xp)/(nxt.xp-cur.xp))*100:100;
  return {idx,title:cur.title,pct:Math.max(0,Math.min(100,pct))};}
function renderHUD(){const li=levelInfo();
  $('#hLvl').textContent=li.title; $('#hXp').textContent=G.xp+' XP'; $('#hBar').style.width=li.pct+'%';
  $('#hStreakN').textContent=G.streak;
  const c=$('#hStreak');c.classList.remove('t1','t2','t3');
  if(G.streak>=12)c.classList.add('t3'); else if(G.streak>=7)c.classList.add('t2'); else if(G.streak>=3)c.classList.add('t1');
  $('#hStreakEm').textContent=G.streak>=12?'☄️':(G.streak>=7?'💥':'🔥');
  $('#hBadgeN').textContent=Object.keys(G.badges).length;
  $('#hSndEm').textContent=SOUND?'🔊':'🔇';
  $('#hSnd').classList.toggle('off',!SOUND);}

let toastQ=[],toasting=false;
function toast(em,tt,td){toastQ.push([em,tt,td]);if(!toasting)nextToast();}
function nextToast(){if(!toastQ.length){toasting=false;return;}toasting=true;const[em,tt,td]=toastQ.shift();
  $('#toEm').textContent=em;$('#toTt').textContent=tt;$('#toTd').textContent=td;const t=$('#toast');
  t.classList.add('show');setTimeout(()=>{t.classList.remove('show');setTimeout(nextToast,380);},1900);}
function unlock(id){if(G.badges[id])return;const b=BG.find(x=>x.id===id);if(!b)return;G.badges[id]=1;
  G.xp+=50;toast(b.em,'Badge unlocked: '+b.name,'+50 XP · '+b.desc);sfxBadge();renderHUD();}
function levelUpCheck(before){const a=levelInfo().idx;if(a>before){toast('🚀','Level up! '+LV[a].title,'You reached a new rank.');sfxLevel();}}
function floater(x,y,txt,color){const f=el('div','floater',txt);f.style.left=x+'px';f.style.top=y+'px';f.style.color=color;document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}

/* the shout-outs */
const CALLS={2:'NICE! ✌️',3:'TRIPLE! 🔥',4:'HEATING UP! 🌡️',5:'ON FIRE! 🔥🔥',6:'RAMPAGE! 💥',
  7:'UNSTOPPABLE! ⚡',8:'MONSTROUS! 👹',10:'GODLIKE! 🌌',12:'INFERNO! ☄️',15:'LEGENDARY! 👑',18:'ELASTIC GOD! 🏛️'};
const CHEERS=['YES! 🎉','BOOM! 💥','CLEAN! ✨','SHARP! 🎯','NAILED IT! 🔨','CORRECT! ✅','TOO EASY! 😎','CHEF’S KISS 👌'];
const TAUNTS=['NOPE! 👎','OOF. 👎','BONK! 👎','YIKES. 👎','BRUTAL. 👎','DENIED! 👎','OUCH! 👎','NOT TODAY. 👎'];

function onAnswer(ok,x,y,card){
  if(ok){
    G.streak++; G.best=Math.max(G.best,G.streak);
    const bonus=Math.min(30,Math.max(0,(G.streak-1)*4));    // streak bonus grows with the run
    const gain=10+bonus;
    const before=levelInfo().idx; G.xp+=gain; levelUpCheck(before);
    sfxRight(G.streak);
    crackers(x,y,G.streak);
    greenFlash(G.streak);
    mega(G.streak>=12?'🏆':(G.streak>=7?'💥':(G.streak>=3?'🔥':'👍')),true);
    floater(x,y,'+'+gain+' XP','var(--lime)');
    bigCall(CALLS[G.streak]||rnd(CHEERS));
    if(card){card.classList.add('hitgood');setTimeout(()=>card.classList.remove('hitgood'),1400);}
    if(!G.badges.b_first)unlock('b_first');
    if(G.streak===5)unlock('b_streak5');
    if(G.streak===10)unlock('b_streak10');
    if(G.streak===15)unlock('b_streak15');
    renderHUD();
  } else {
    const lost=G.streak;
    G.streak=0;
    sfxWrong();
    thumbsDown(x,y,lost);
    mega('👎',false);
    bigCall(lost>=3?'STREAK BROKEN! 👎':rnd(TAUNTS),true);
    floater(x,y,lost>=3?'−'+lost+' streak':'✕','var(--red)');
    if(card){card.classList.add('hitbad');setTimeout(()=>card.classList.remove('hitbad'),1400);}
    renderHUD();
  }
}

/* ---------- 🎆 crackers — intensity scales with the streak ---------- */
const CRK=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24','#FB7185','#FFFFFF'];
function burstAt(x,y,n,spread,size){
  const ring=el('div','boom');ring.style.left=x+'px';ring.style.top=y+'px';
  const rs=spread*1.6;ring.style.width=rs+'px';ring.style.height=rs+'px';
  ring.style.borderColor=rnd(CRK);document.body.appendChild(ring);setTimeout(()=>ring.remove(),740);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+Math.random()*0.4;
    const r=spread*(0.5+Math.random()*0.75);
    const s=el('div','spark'),dot=el('i');s.appendChild(dot);
    s.style.left=x+'px';s.style.top=y+'px';
    const col=rnd(CRK),w=size*(0.6+Math.random()*0.9);
    dot.style.background=col;dot.style.boxShadow='0 0 10px '+col+',0 0 22px '+col;
    dot.style.width=w+'px';dot.style.height=w+'px';
    const d=0.8+Math.random()*0.6;
    s.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--ty',(Math.sin(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--d',d.toFixed(2)+'s');
    document.body.appendChild(s);setTimeout(()=>s.remove(),(d+0.4)*1000);
  }
}
function launchTo(x,y,n,spread,size){
  const rd=0.30+Math.random()*0.18;
  const rk=el('div','rocket');rk.style.left=x+'px';rk.style.top=innerHeight+'px';
  const col=rnd(CRK);rk.style.background=col;rk.style.boxShadow='0 0 12px '+col;
  rk.style.setProperty('--ry',(y-innerHeight)+'px');rk.style.setProperty('--rd',rd.toFixed(2)+'s');
  document.body.appendChild(rk);
  setTimeout(()=>{rk.remove();burstAt(x,y,n,spread,size);if(SOUND)noise(0,0.12,0.07,2200);},rd*1000);
}
function flash(){if(reduced)return;const f=el('div','flash');document.body.appendChild(f);setTimeout(()=>f.remove(),580);}
function greenFlash(streak){
  if(reduced)return;
  const g=el('div','greenflash');document.body.appendChild(g);setTimeout(()=>g.remove(),620);
  const v=el('div','vignette good');document.body.appendChild(v);setTimeout(()=>v.remove(),900);
  document.body.classList.add('zoomit');setTimeout(()=>document.body.classList.remove('zoomit'),520);
  if(streak>=7)flash();
}
/* tier 0: 2 shells · tier 1 (3+): 3 · tier 2 (7+): 5 + white flash
   tier 3 (12+): 8 shells, wider, plus a confetti barrage                    */
function crackers(x,y,streak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const s=streak||1;
  const tier = s>=12?3 : s>=7?2 : s>=3?1 : 0;
  const shells=[2,3,5,8][tier];
  const grow=1.25+tier*0.32;
  burstAt(x,y,Math.round(20*grow),Math.round(120*grow),7+tier);
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<shells;i++){
    const sx=W*(0.10+Math.random()*0.80), sy=H*(0.10+Math.random()*0.32);
    setTimeout(()=>launchTo(sx,sy,Math.round(26*grow),Math.round(150*grow),6+tier),70+i*130);
  }
  if(tier>=1)confetti(24*tier);
  if(tier>=3){
    confetti(90);
    setTimeout(()=>{for(let i=0;i<4;i++){const sx=W*(0.12+Math.random()*0.76),sy=H*(0.08+Math.random()*0.30);
      setTimeout(()=>launchTo(sx,sy,36,225,9),i*120);}},720);
  }
}
function confetti(count){if(reduced)return;const cols=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24'];const n=count||100;
  for(let i=0;i<n;i++){const c=el('div','confetti');c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.transform='rotate('+(Math.random()*360)+'deg)';
    const d=2.4+Math.random()*1.8;c.style.animation='fall '+d+'s linear '+(Math.random()*0.6)+'s forwards';document.body.appendChild(c);setTimeout(()=>c.remove(),(d+1)*1000);}}
const cst=document.createElement('style');cst.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}';document.head.appendChild(cst);

/* ---------- 👎 thumbs down — a full shower, always heavy ---------- */
function thumbsDown(x,y,lostStreak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const rf=el('div','redflash');document.body.appendChild(rf);setTimeout(()=>rf.remove(),720);
  const vg=el('div','vignette');document.body.appendChild(vg);setTimeout(()=>vg.remove(),980);
  document.body.classList.add('shakeit');setTimeout(()=>document.body.classList.remove('shakeit'),500);
  /* the bigger the streak you just torched, the heavier the shower */
  const extra=Math.min(26,(lostStreak||0)*3);
  const popN=22+extra, rainN=20+extra;
  for(let i=0;i<popN;i++){                       // burst outward from the tapped option
    const t=el('div','tdown pop','👎');
    const ang=(i/popN)*Math.PI*2+Math.random()*0.5;
    const r=110+Math.random()*230;
    const d=1.0+Math.random()*0.8;
    t.style.left=x+'px';t.style.top=y+'px';
    t.style.fontSize=(24+Math.random()*38).toFixed(0)+'px';
    t.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    t.style.setProperty('--ty',(Math.sin(ang)*r+150).toFixed(1)+'px');
    t.style.setProperty('--rot',((Math.random()-0.5)*720).toFixed(0)+'deg');
    t.style.setProperty('--d',d.toFixed(2)+'s');
    document.body.appendChild(t);setTimeout(()=>t.remove(),(d+0.3)*1000);
  }
  for(let i=0;i<rainN;i++){                      // and a shower down the whole screen
    const t=el('div','tdown rain','👎');
    const d=1.5+Math.random()*1.6;
    t.style.left=(Math.random()*96)+'vw';t.style.top='-50px';
    t.style.fontSize=(22+Math.random()*40).toFixed(0)+'px';
    t.style.setProperty('--ty',(innerHeight+150)+'px');
    t.style.setProperty('--rot',((Math.random()-0.5)*900).toFixed(0)+'deg');
    t.style.setProperty('--d',d.toFixed(2)+'s');
    t.style.animationDelay=(Math.random()*0.6).toFixed(2)+'s';
    document.body.appendChild(t);setTimeout(()=>t.remove(),(d+1.2)*1000);
  }
}

        'The salesman visit as the main way an order gets placed',
        'The beat plan, so each outlet is served on a fixed day'],
  why:'<b>B2B e-com digitises the distributor/wholesaler, but the retailer still buys on assortment, service and price.</b><div class="work">Offline → distributor (×N) or wholesaler\nOnline  → app ordering + organised fulfilment\nSame    → assortment · service · price</div>The other options are the parts of the offline model that the app <i>replaces</i>.<br><br>Change the medium, keep the motivation — the same idea as the shopper journey.'},

 {t:'models',tag:'concept',diff:'medium',
  q:'Meesho, Amway and Tupperware all sit in the C2C model. What is its unifying factor, especially for non-users of e-commerce?',
  opts:['Trust',
        'Price',
        'Speed',
        'Range'],
  why:'<b>C2C runs on trust, advice and interaction between people.</b> Catalogues plus drop-shipping digitised what Amway and Tupperware did through people.<div class="work">C2C → trust · advice · interaction\n      Amway / Tupperware → Meesho, Shopsy, DealShare, Quikr, eBay</div>Meesho also wins on price, but the point is that a known person vouching for the product is what converts someone who does not shop online.<br><br>For first-time buyers, trust beats price.'},

 {t:'models',tag:'apply',diff:'medium',trap:true,
  q:'In the “6Ps reimagined”, which P does <b>“multiple messaging for different audiences”</b> belong to?',
  opts:['Proposition',
        'Promotion',
        'Packaging',
        'Positioning'],
  why:'<b>Proposition → multiple messaging for different audiences.</b> Promotion is a different P.<div class="work">Product     → rapid pace of product innovation\nPlace       → wider physical reach, lower initial costs\nPrice       → discounts; best price discovery\nPromotion   → performance marketing\nProposition → multiple messaging for different audiences\nPackaging   → last-mile-friendly packaging is non-negotiable</div>“Messaging” sounds like promotion, which is why it is the trap. Online, promotion became performance marketing; the <i>proposition</i> can be cut differently for each audience.<br><br>Learn the six one-liners as pairs.'},

/* ---------------- Online Shopper Journey ---------------- */
 {t:'journey',tag:'concept',diff:'medium',
  q:'Which moment of truth is the research a shopper does <b>before</b> seeing the product — Google, YouTube, Instagram, Amazon search?',
  opts:['Zero moment of truth',
        'First moment of truth',
        'Second moment of truth',
        'Third moment of truth'],
  why:'<b>ZMOT = pre-shelf research; FMOT = the shelf (now the listing page); SMOT = using the product; TMOT = sharing the experience (reviews).</b><div class="work">ZMOT → research     → Google, YouTube, Instagram, Amazon\nFMOT → shelf        → product listing page\nSMOT → usage        → (unchanged)\nTMOT → share/review → ratings & reviews online</div>The key line: “research and reviews have almost fully moved online” — that is ZMOT and TMOT.<br><br>Only the second moment, actually using the product, stays physical.'},

 {t:'journey',tag:'apply',diff:'medium',
  q:'Buying a phone offline meant asking the store assistant, comparing models in the bay, and checking for a deal. What is the key point about the online version?',
  opts:['Motivations at every step are the same; only the medium is different',
        'Shoppers skip the comparison step online and buy on the first deal seen',
        'Store assistants still decide the purchase, even when it is made online',
        'Online journeys are shorter, so research no longer matters for phones'],
  why:'<b>“Motivations at every step are the same, medium is different.”</b><div class="work">Understand features → assistant      → content & videos\nCompare             → bays           → listing pages & comparisons\nCheck for a deal    → floor stack    → deal corner</div>Online journeys are, if anything, more complex — touchpoints have exploded with digital growth.<br><br>Map the offline step to its online replacement; the job to be done is unchanged.'},

 {t:'journey',tag:'concept',diff:'easy',
  q:'Which online feature replaced the offline <b>floor stack</b>?',
  opts:['The deal corner',
        'The bestseller list',
        'The FSU display',
        'The search bar'],
  why:'<b>Floor stack = deal corner; display = FSUs; curation = bestseller.</b><div class="work">Store assistant → content & videos\nBays            → listing pages & comparisons\nFloor stack     → deal corner (“Today’s Deals”)\nDisplay         → FSUs\nCuration        → bestsellers</div>Floor stacks are where offline retailers pile promoted stock — online, that job is the deals page.<br><br>Learn the five pairs; an MCQ can be built on any of them.'},

 {t:'journey',tag:'apply',diff:'medium',trap:true,
  q:'Which channel characteristic explains why delivery costs push online brands toward <b>single packs of larger volume</b>?',
  opts:['Unit economics',
        'Endless aisle',
        'Evolving audience',
        'Rapid innovation'],
  why:'<b>Three channel characteristics: endless aisle, evolving audience, unit economics.</b><div class="work">Endless aisle     → room to experiment and launch niches\nEvolving audience → sell larger packs and premium offerings\nUnit economics    → delivery costs favour single packs of larger volume</div>“Evolving audience” also mentions larger packs — that is the trap. There, the reason is an audience willing to trade up; under unit economics, the reason is that a delivery costs the same for a small or large pack.<br><br>Same outcome (bigger packs), two different causes.'},

 {t:'ux',tag:'apply',diff:'medium',
  q:'Amazon’s UX is built around a prominent search bar. Which offline behaviour does it mimic?',
  opts:['Finding goods in a large, cluttered store',
        'Browsing to find what you like with help',
        'Buying off a weekly shopping list quickly',
        'Asking a trusted expert what to choose'],
  why:'<b>Amazon = search-driven, because it mimics finding goods in a huge, cluttered store</b> (1 mn+ sellers, 20 mn+ SKUs, 40+ categories).<div class="work">Amazon     → find goods in a big store   → search-driven\nNykaa      → browse to find what you like → browse-driven\nBigBasket  → buy off a shopping list     → cart-building</div>With 20 mn SKUs, nobody browses — you ask for it by name.<br><br>The UX follows the mission, and the brand’s playbook follows the UX.'},

 {t:'ux',tag:'concept',diff:'medium',
  q:'Which factor is <b>not</b> one of those the Amazon algorithm weighs when ranking results?',
  opts:['The brand’s offline market share',
        'Sales velocity',
        'Customer reviews',
        'Delivery time promised to the shopper'],
  why:'<b>Six factors: search-term relevance, sales conversions, customer reviews, sales velocity, delivery time, pricing</b> — all aimed at “connecting users to relevant products as quickly as possible”.<div class="work">Relevance · Conversions · Reviews\nVelocity  · Delivery time · Pricing</div>Offline share does not enter the algorithm. A small D2C brand can outrank a giant if its listing converts and sells.<br><br>Every factor is something the brand can work on through its listing, price or availability.'},

 {t:'ux',tag:'apply',diff:'medium',
  q:'A brand is building its Nykaa listing. Which set of levers matches Nykaa’s browse-driven UX?',
  opts:['Clickable content, education & recommendation, newsiness',
        'Keyword-packed text, image meta-tagging, search-ad plans',
        'Value hooks, bestseller-led messaging and winning search',
        'Lowest price, fastest delivery and the most SKUs listed'],
  why:'<b>Nykaa is browse-driven — a high-involvement category with deep options where “right for me” is the driver.</b> The brand needs listing desirability through content with high pick-me-up value.<div class="work">Amazon (search) → keyword text, image tags, R&R, pricing science, search ads\nNykaa (browse)  → clickable content, education & recommendation, newsiness\nBigBasket (cart)→ win search, bestsellers, value hooks</div>Keyword packing is the Amazon playbook; value hooks are BigBasket’s.<br><br>One brand, three platforms, three playbooks — that is the point of studying UX.'},

 {t:'ux',tag:'apply',diff:'medium',
  q:'Which BigBasket UX feature mimics a shopper’s own shopping list?',
  opts:['A custom list built from previous buying history',
        'A prominent search bar with keyword suggestions',
        'Click-inducing creatives and more brands to browse',
        'Expert reviews and tutorials on the product page'],
  why:'<b>BigBasket is cart-building driven</b> because it mimics buying off a shopping list — planned, routine, price-led.<div class="work">BB UX\n  Value credentials on basket starters\n  Custom list basis buying history\n  Simplified category nav, like store aisles\n  Previously bought items by frequency\n  Colloquial search indexing (“sabun”)</div>Search with suggestions is Amazon; click-inducing creatives are Nykaa.<br><br>Routine missions want speed to a full cart, not discovery.'},

 {t:'ux',tag:'concept',diff:'hard',trap:true,
  q:'Nykaa’s insight is first stated as “I like to choose what is best for me from the right options with a trusted expert who helps me shop.” Why is that statement challenged?',
  opts:['It is an observation; ask “why” until you reach “I feel happy when I find what is best for me”',
        'It is too short; an insight has to list every product feature that solves the consumer’s problem',
        'It is a value proposition, which should instead read “the one-stop premium beauty store”',
        'It is about the retailer, not the shopper, so it belongs under the brand persona instead'],
  why:'<b>“An insight is a distilled and smallest version of truth … most insights quoted are observations.”</b> The fix: ask why until you cannot answer any more.<div class="work">Observation → “I like to choose what is best for me from the right\n               options with a trusted expert who helps me shop”\nWhy? → why? →\nInsight     → “I feel happy when I can find what is best for me”</div>The first statement describes behaviour; the insight names the feeling underneath it.<br><br>If your “insight” could be a feature list, it is an observation.'},

 {t:'ux',tag:'concept',diff:'medium',
  q:'In the Retailer DNA framework, which element is “a sharp, succinct line that captures the essence of the retailer”?',
  opts:['Value proposition',
        'Differentiator',
        'Brand persona',
        'Key consumer insight'],
  why:'<b>Seven elements: addressable market, target audience, insight, features, differentiator, brand persona, value proposition.</b><div class="work">Nykaa DNA\n  Market        → beauty brands across price points\n  Audience      → urban women enthusiastic about beauty\n  Insight       → I feel happy when I find what is best for me\n  Features      → assortment, curation, expert content, authenticity\n  Differentiator→ only Nykaa: global selection + deep expert content\n  Persona       → young, trendy, expert, upmarket\n  Value prop    → the one-stop destination for the premium beauty shopper</div>The differentiator answers “how are you different”; the value proposition is the one-line essence.<br><br>Learn Nykaa’s seven lines — they are the worked example.'},

 {t:'ux',tag:'apply',diff:'medium',
  q:'Before Nykaa, women bought beauty from small stores with limited assortment and a male owner, guided by magazine trends. Which Nykaa feature answered the fear of fakes?',
  opts:['A 100% authenticity guarantee',
        'A curated expert content engine',
        'A large range of global brands',
        'Trend news and recommendations'],
  why:'<b>Online beauty raised three new problems — transit damage, fakes and no testing — on top of the old frictions.</b> 100% authentic answers fakes directly.<div class="work">Old frictions → trust · definition of beauty · assortment width\n               (high cost of entry = gatekeeping) · limited info (magazines)\nNykaa answers → right categories · global brands · content engine\nOnline risks  → transit damage · fakes · no testing\nFeature       → 100% authentic</div>Global brands solved assortment width; content solved limited information. Neither answers fakes.<br><br>Match each feature to the friction it removes.'},

/* ---------------- Flywheel, Platforms & Equation ---------------- */
 {t:'platforms',tag:'concept',diff:'medium',
  q:'In the e-commerce flywheel, what does a <b>lower cost structure</b> feed into next?',
  opts:['Lower prices',
        'More sellers',
        'More traffic',
        'More selection'],
  why:'<b>The flywheel: selection → customer experience → traffic → sellers → selection … and growth → lower cost structure → lower prices → customer experience.</b><div class="work">Selection → CX → Traffic → Sellers → (more) Selection\n                 ↑                       ↓\n          Lower prices ← Lower cost structure ← Growth</div>Each turn makes the next easier — that is why it is a flywheel and why <b>selection is the starting point</b> for every e-com model.<br><br>Scale lowers cost, lower cost funds lower prices, lower prices improve CX.'},

 {t:'platforms',tag:'calc',diff:'medium',
  q:'A platform gets 10 lakh visits a month at 4% conversion, an AOV of ₹500 and a frequency of 2 orders per user. What is monthly revenue?',
  given:['Traffic 10,00,000','Conversion 4%','AOV ₹500','Frequency 2'],
  opts:['₹4 crore',
        '₹2 crore',
        '₹40 lakh',
        '₹20 crore'],
  why:'<b>Traffic × Conversion = Users; Users × AOV × Frequency = Revenue.</b><div class="work">Users   = 10,00,000 × 4%      = 40,000\nRevenue = 40,000 × ₹500 × 2   = ₹4,00,00,000 = ₹4 crore</div>₹2 crore forgets frequency; ₹20 crore treats 4% as 0.2 (i.e. uses 20,000 × 500 × 2 × 10). ₹40 lakh drops a zero in the users.<br><br>Write the two lines of the equation every time — the slips are all in skipped steps.'},

 {t:'platforms',tag:'apply',diff:'medium',trap:true,
  q:'A brand launches a combo pack on a platform. Which equation term does this lever target?',
  opts:['AOV',
        'Conversion',
        'Frequency',
        'Traffic'],
  why:'<b>Portfolio, bundles and combos / multipacks are AOV levers.</b> They raise the value of each order.<div class="work">AOV = order value ÷ orders\nCombo of 3 × ₹150 = ₹450 order vs ₹150 single</div>It can feel like conversion (a deal converts), which is the trap — but bundles are an AOV lever.<br><br>Order <i>size</i> → AOV. Order <i>count</i> → frequency.'},

 {t:'platforms',tag:'concept',diff:'easy',
  q:'Which platform type has a <b>low-to-medium AOV of about ₹350–700</b>, driven by top-up purchases and instant gratification?',
  opts:['Quick commerce',
        'Marketplace',
        'Specialty platform',
        'D2C'],
  why:'<b>Q-commerce (Zepto, Blinkit, Instamart): top-up purchases, a monthly shop split into weekly ones, instant gratification.</b><div class="work">               Shopper need                     AOV\nMarketplace    research, trials, price compare  medium–high (category)\nQ-commerce     top-up, instant gratification    low–medium (₹350–700)\nSpecialty      specific missions, discovery     high (premium/subscription)\nD2C            trusted expertise, exclusivity   medium–high</div>Specialty (Nykaa, Tira, Tata 1mg) is the high-AOV end.<br><br>Q-com’s AOV problem is why pack strategy matters so much there.'},

 {t:'platforms',tag:'apply',diff:'medium',
  q:'A brand’s D2C site (think Minimalist or Mamaearth) is valued above all for which brand-strategy reason?',
  opts:['1P data and owning the customer',
        'Pan-India reach through fulfilment centres',
        'Pack strategy, promotions and visibility',
        'Content and market development for niches'],
  why:'<b>Brand strategy by platform type:</b><div class="work">Marketplace → premium; innovation launchpad; test & learn\nQ-commerce  → pack strategy; promo + visibility\nSpecialty   → content and market development are critical\nD2C         → 1P data and owning the customer</div>On every other platform the retailer owns the customer relationship and data. D2C is the only place the brand does.<br><br>D2C is rarely the biggest channel; it is the one that teaches the brand about its customers.'},

 {t:'selection',tag:'apply',diff:'medium',
  q:'What is the main user driver for an <b>urgent / just-in-time</b> mission (snacks, ice creams, mobile accessories)?',
  opts:['Delivery time',
        'Value and low effort',
        'Assortment and content',
        'Content, assortment and service'],
  why:'<b>Four missions, four drivers.</b><div class="work">Routine      → personal care, home care, staples, dairy → value & low effort\nUrgent / JIT → fresh, dairy, snacks, ice cream, accessories → delivery time\nExperiential → beauty, apparel, furniture → assortment & content\nResearch     → white goods, mobiles → content, assortment & service</div>Fresh and dairy appear in both routine and urgent — the category does not decide the mission, the need does.<br><br>“Same category is shopped differently basis the mission.”'},

 {t:'selection',tag:'apply',diff:'hard',trap:true,
  q:'Atta can be bought as a 10 kg routine pack, a 1 kg urgent top-up, an organic experiential pick, or a keto atta after research. What does this illustrate?',
  opts:['The same category is shopped differently depending on the mission',
        'Atta is a research category, so content always decides the purchase',
        'Each pack size belongs to a different category with its own buyers',
        'Missions are fixed by category, so atta can only be a routine buy'],
  why:'<b>“Same category is shopped differently basis the mission.”</b> The mission sets the pack, the platform and the driver.<div class="work">Routine      → large pack        → value, low effort\nUrgent / JIT → small pack        → delivery time\nExperiential → organic / premium → assortment & content\nResearch     → keto / functional → content & service</div>The trap is assigning a mission to a category. Selection planning starts from the mission, then picks categories.<br><br>Ask “which mission?” before “which category?”.'},

 {t:'selection',tag:'concept',diff:'medium',
  q:'What is the correct order of the selection-planning process?',
  opts:['Designed CX → categories → SKU depth & width → profitability',
        'Categories → designed CX → profitability → SKU depth & width',
        'Profitability → SKU depth & width → categories → designed CX',
        'SKU depth & width → categories → designed CX → profitability'],
  why:'<b>Start with the customer experience you are designing, then work down.</b><div class="work">1 Designed CX    → users, mission, categories, geography\n2 Categories     → identify the relevant ones\n3 SKU            → decide brand width and SKU depth\n4 Profitability  → filter by AOV and margin</div>Profitability comes <i>last</i>, as a filter — not first. Starting from margin is how retailers end up without basket starters.<br><br>CX first, margin last.'},

 {t:'selection',tag:'calc',diff:'medium',
  q:'Match the selection numbers: which platform runs <b>3,000+ SKUs across 10+ categories</b> from dark stores within a cluster locality?',
  opts:['Zepto',
        'BigBasket',
        'Amazon',
        'Nykaa'],
  why:'<b>Selection scales with the promise.</b><div class="work">              Promise                     Fulfilment              Cat   Sub   SKUs\nAmazon        the everything store        FCs across India        40+   200+  20 mn+\nBigBasket     supermarket at your door    FCs within the city     10+   50+   40,000+\nZepto         don’t blink, just Zepto it  dark stores in a cluster 10+  30+   3,000+</div>Zepto and BigBasket both run 10+ categories — the gap is depth (3,000 vs 40,000 SKUs), because a dark store has to fit in a neighbourhood.<br><br>Faster delivery → smaller store → narrower selection.'},

 {t:'selection',tag:'apply',diff:'medium',
  q:'A shopper researching a washing machine has a consideration set of Samsung, Whirlpool, LG and Electrolux. How should a retailer plan this selection?',
  opts:['Depth within each brand — types, models and capacities — not more brands',
        'Width across brands — add every brand available, since shoppers like to compare',
        'Only bestsellers — one model per brand, to keep the listing page clean',
        'Lowest price points — budget models, since value is the main driver'],
  why:'<b>“User is not looking for brand width.”</b> They arrive with a consideration set and compare specifications.<div class="work">Brand    → Samsung\n Type    → top load / front load\n  Model  → inverter, magic filter, hygiene steam, AI control\n   Size  → 10, 9, 8 kg / 9, 8, 7 kg</div>A research mission is driven by content, assortment and service — the assortment it needs is deep, not wide.<br><br>Width for discovery missions; depth for research missions.'},


/* ---------------- Head, Torso, Tail ---------------- */
 {t:'mix',tag:'calc',diff:'medium',trap:true,
  q:'What is the typical split of the <b>head</b> in contribution to business vs contribution to selection?',
  opts:['~50% of the business from ~20% of the selection',
        '~20% of the business from ~50% of the selection',
        '~30% of the business from ~30% of the selection',
        '~50% of the business from ~50% of the selection'],
  why:'<b>Head: ~50% of business from 20% of SKUs. Tail: 20% of business from ~50% of SKUs.</b><div class="work">          Business   Selection\nHead       ~50%        20%\nTorso       30%        30%\nTail        20%       ~50%</div>The second option is the tail — the mirror image, and the easiest slip. From the shopper’s side, the head is the <b>basket starter</b>, the torso the builder, the tail the filler.<br><br>The chart: sales fall steeply as you move down the number of unique products.'},

 {t:'mix',tag:'apply',diff:'medium',
  q:'What is the retailer’s objective for its <b>head</b> SKUs?',
  opts:['Drive orders and value; lead on price, delivery and availability',
        'Drive profitability and aim for parity versus competitors',
        'Drive profitability and cut the risk of unhealthy, ageing inventory',
        'Build the range around a shopping mission, SKU by SKU'],
  why:'<b>Objectives by tier:</b><div class="work">Head  → drive orders & value; lead all aspects — price, delivery, availability\nTorso → drive profitability; aim for parity vs competitors\nTail  → drive profitability; reduce unhealthy-inventory risk;\n        build basis shopping mission</div>Torso is parity; tail is profit and risk. Only the head is where the retailer must <i>lead</i>.<br><br>Head wins the customer; tail earns the margin.'},

 {t:'mix',tag:'concept',diff:'medium',
  q:'Which tier has the <b>highest realised profit and the most scope for margin improvement</b>, but the lowest sales velocity?',
  opts:['Tail',
        'Head',
        'Torso',
        'All three equally'],
  why:'<b>Velocity and margin run in opposite directions down the curve.</b><div class="work">          Velocity   Realised profit   Margin scope\nHead      high       low               low\nTorso     medium     medium            medium\nTail      low        high              high</div>The head sells fastest but is priced competitively, so it earns least per unit; the tail is the reverse.<br><br>This tension is the whole “mix vs margin” problem.'},

 {t:'mix',tag:'calc',diff:'hard',
  q:'Ten brands earn net PPMs from 20% to 33%. The blended margin is 23.6%. The retailer shifts 5 pts of share from head brand A (20% PPM) and 1 pt from B (22%) to the tail. Blended margin becomes 24.1%. What is the risk?',
  given:['Old blended PPM 23.6%','New blended PPM 24.1%','Brand A share 20% → 15%','Head share 56% → 50%'],
  opts:['A 50 bps gain bought by cutting basket starters, so orders and AOV may fall',
        'A 5% margin gain, which is large enough to justify any loss in orders or AOV',
        'A 50 bps gain with no downside, since tail brands earn the most margin',
        'A margin loss of 0.5 pts, as the tail sells too slowly to offset the head'],
  why:'<b>Weighted margin = Σ (PPM × share).</b><div class="work">Old: 20%×20 + 22%×19 + 21%×17 + … + 30%×3  = 23.6%\nNew: 20%×15 + 22%×18 + 21%×17 + … + 30%×6  = 24.1%\nGain = 24.1 − 23.6 = 0.5 pts = 50 bps\nHead share: 20+19+17 = 56%  →  15+18+17 = 50%</div>The margin is up only 50 basis points — not 5% — and it came from starving the head. “Customer orders and AOVs can drop if customers don’t find their basket starters.”<br><br>Mix and margin is a tightrope: profit on one side, customer experience on the other.'},

/* ---------------- Operating Model & Availability ---------------- */
 {t:'ops',tag:'concept',diff:'easy',
  q:'In a <b>1P</b> operating model, who owns the inventory?',
  opts:['The retailer, which buys the stock from the brand',
        'The brand, which sells on the platform as a seller',
        'The logistics partner, which holds stock in transit',
        'The shopper, once the order has been placed online'],
  why:'<b>1P: bought by the retailer, held in the retailer’s FC, shipped on the retailer’s network.</b><div class="work">     Inventory   Warehousing                 Shipping\n1P   retailer    retailer FC                 retailer network\n3P   brand       own warehouse OR retailer FC  self-shipped OR retailer network</div>In 3P the brand is the seller and keeps ownership, with a choice on warehousing and shipping.<br><br>Ownership of the stock is what defines 1P vs 3P.'},

 {t:'ops',tag:'apply',diff:'medium',
  q:'Why might a brand choose 3P selling despite worse economics than 1P?',
  opts:['Control over listing and pricing, plus inventory and warehouse-space control',
        'Higher profitability, since 3P costs are lower than 1P costs at every price point and ASP',
        'Lower operational load, since the platform does all of the work under 3P',
        'Lower selling fees, since 3P sellers do not pay the platform a commission'],
  why:'<b>3P: the brand bears inventory, warehousing, pick & pack, shipping, returns and selling fees — but gains control.</b><div class="work">                     1P        3P\nOperational bandwidth good      medium\nProfitability        good      weak\nControl listing/price weak     good\nInventory efficiency medium    good\nWarehouse space ctrl weak      good</div>“Operational upsides can make up for some difference in costs.” 3P is <i>more</i> operational work, not less, and selling fees apply.<br><br>1P buys you economics; 3P buys you control.'},

 {t:'ops',tag:'concept',diff:'medium',
  q:'When do 1P economics work better than 3P?',
  opts:['At a particular value density and average selling price',
        'Whenever the brand wants control over its listing price',
        'Only for brands with their own warehouses and shipping',
        'For any product with a high rate of returns from buyers'],
  why:'<b>“At a particular value density and ASP, 1P economics work better.”</b> Under 1P, the retailer bears the cost of inventory, warehousing, shipping and returns.<div class="work">Cost of inventory · Warehousing, pick & pack · Shipping & returns · Selling fees\n3P → borne by the brand\n1P → borne by the retailer</div>Control over pricing is the reason to choose <i>3P</i>, not 1P.<br><br>Low-value, bulky items are expensive to ship; value density decides who should carry that cost.'},

 {t:'ops',tag:'calc',diff:'medium',
  q:'A platform holds a 95% in-stock rate. Of 1,00,000 product-page visits, what is the right reading of the 5% that hit out-of-stock?',
  given:['In-stock 95%','Visits 1,00,000'],
  opts:['5,000 visits hit OOS; some of them, not all, become lost sales',
        '5,000 visits hit OOS; every one of them is a lost sale for the brand',
        '95,000 visits hit OOS; only 5,000 of them are able to buy the item',
        '500 visits hit OOS; at 95%, availability is effectively complete'],
  why:'<b>95% is the benchmark for good in-stock.</b><div class="work">OOS visits = 1,00,000 × 5% = 5,000</div>“Some of the 5% users (OOS) would translate to lost sales” — some wait, some substitute within the brand, some switch. Treating every OOS as lost overstates the loss; treating 95% as “complete” ignores that availability is a competitive advantage in a volatile market.<br><br>Availability is housekeeping: you only notice it when it goes wrong.'},

 {t:'ops',tag:'concept',diff:'medium',
  q:'What does the cost-vs-service curve show?',
  opts:['The incremental cost of service rises at higher service levels',
        'Service and cost rise in a straight line, at a constant ratio to each other',
        'Higher service levels lower cost, by reducing lost sales',
        'Cost is flat to 95% service, then rises in a single step'],
  why:'<b>Going from 50% to 90% is cheap; going from 90% to 95% costs far more.</b> The curve steepens.<div class="work">50% → 90% → 95% service\ncost:  low → moderate → steep</div>So the right service level depends on the business: new vs established, high vs low margin, high vs low volatility.<br><br>“Cost–service trade-off is different for different stages. Make your operating model.”'},

 {t:'events',tag:'concept',diff:'medium',
  q:'Which is the right sequence of the planning process?',
  opts:['Lock the business plan → align covers & reordering → adjust for short-term phasing',
        'Adjust for phasing → lock the business plan → align the covers and the reorder plan',
        'Align covers & reordering → adjust for phasing → lock the plan for the year ahead',
        'Lock the business plan → adjust for phasing → set reorder levels after D-Day'],
  why:'<b>1 Lock the business plan → 2 Align inventory covers and reordering → 3 Adjust for short-term phasing.</b><div class="work">1 Plan   → in-stock-corrected trends, demand events/season,\n           pricing/media inputs, check financial forecast\n2 Covers → days of cover, reorder quantities, reorder level\n3 Phasing→ traffic events, buying cycle, seasonality</div>Note “in-stock-corrected” trends: past sales understate demand on days the SKU was out of stock.<br><br>Plan the year, set the buffers, then flex for the spikes.'},

 {t:'events',tag:'calc',diff:'medium',
  q:'A SKU sells 10 units a day. A traffic event from the 11th to the 20th doubles sales. What is the 30-day demand to plan for?',
  given:['Daily sales rate 10','Event days 11th–20th','Event uplift 2×'],
  opts:['400 units',
        '300 units',
        '600 units',
        '320 units'],
  why:'<b>Phase the event into the daily rate; do not apply it to the whole month.</b><div class="work">BAU days   20 × 10 = 200\nEvent days 10 × 20 = 200\nTotal              = 400</div>300 ignores the event; 600 doubles the whole month.<br><br>Events lead to disproportionate offtake spikes — and the inventory curve “gets disrupted quite dramatically”.'},

 {t:'events',tag:'calc',diff:'medium',trap:true,
  q:'A brand holds 600 units at the FC and sells 20 a day — 30 days of cover. During a 2× event, how many days of cover does that stock give?',
  given:['Stock 600','Daily sales 20','Event uplift 2×'],
  opts:['15 days',
        '30 days',
        '60 days',
        '40 days'],
  why:'<b>Days of cover = stock ÷ daily sales rate.</b> Cover is measured against the rate you will actually sell at.<div class="work">BAU   600 ÷ 20 = 30 days\nEvent 600 ÷ 40 = 15 days</div>60 days divides by half the rate — the inverted direction. The trap is quoting BAU cover going into an event.<br><br>Cover shrinks exactly when demand spikes — which is why the event cycle plans inwarding 60 days out.'},

 {t:'events',tag:'apply',diff:'medium',
  q:'Why do platforms run big tentpole events despite the operational disruption?',
  opts:['They are acquisition engines that break habits and bring new users online',
        'They clear unhealthy inventory, which is their only commercial purpose',
