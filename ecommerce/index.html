  why:'<b>Events are acquisition engines: they lead new users to platforms and break the inertia of existing habit.</b><div class="work">Short, intense media bursts help action\nPrice drives upsizing, which helps economics\nDrives a new set of audience online\n→ high-effort acquisition events, followed by consolidation</div>Prices fall in events, not rise; the gain comes from upsizing and new users, kept during the consolidation phase.<br><br>Event → consolidation → event: each spike lifts the base.'},

 {t:'events',tag:'concept',diff:'hard',
  q:'In the events planning cycle, what happens at <b>N–90</b> (90 days before the event)?',
  opts:['Forecast lock',
        'Input planning',
        'Event readiness markers',
        'Capacity-driven inwarding plan'],
  why:'<b>The cycle counts back from D-Day.</b><div class="work">N–100 → input planning\nN–90  → forecast lock\nN–75  → event readiness markers\nN–60  → capacity-driven inwarding plan\n      → ordering & inwarding\n      → tracking & iterating\nD-Day → event\n      → replenishment</div>Inputs come first (N–100); the forecast is locked ten days later.<br><br>Takeaway: build systems for proactive action rather than post-mortems — and an event playbook for your business.'},
/* ---------------- Order Planning & Reorder Point ---------------- */
 {t:'orders',tag:'concept',diff:'medium',
  q:'Goods have just been delivered to a retailer’s fulfilment centre. What happens next, in order?',
  opts:['GRN at the retailer → fill-rate reconciliation → stock allocated to FCs / stores',
        'Fill-rate reconciliation → GRN at the retailer → appointment for the delivery slot',
        'Stock allocated to FCs / stores → GRN at the retailer → PO released to the brand',
        'Demand consolidation → GRN at the retailer → brand allocates stock to the order'],
  why:'<b>The order cycle runs from demand to shelf, and the paperwork follows the goods.</b><div class="work">FC/store demand → inventory system → demand consolidation\n→ PO released to brand → brand allocates stock → appointment\n→ goods delivered to FC/DC → GRN → FR reconciliation\n→ stock allocated to FC / store</div>The GRN (goods receipt note) records what actually arrived. Only then can the retailer reconcile it against the PO to get the fill rate, and only then is the stock usable.<br><br>Delivered is not the same as available: stock is sellable only after it has been received and allocated.'},

 {t:'orders',tag:'concept',diff:'easy',
  q:'What is a <b>reorder point</b>?',
  opts:['The stock level at which a new order must go out so stock arrives before it runs out',
        'The stock level the brand must hold at its depot before the retailer raises any PO',
        'The date each month on which every SKU is reordered, regardless of how much is left',
        'The minimum quantity a vendor will accept on a single purchase order from a retailer'],
  why:'<b>The reorder point is a trigger level, not a date or a quantity.</b> When stock falls to it, you order — because the new stock takes the lead time to arrive.<div class="work">Reorder point = lead-time demand + safety stock\nLead-time demand = average daily sales × lead time</div>A fixed monthly date is periodic ordering, a different method. The vendor’s minimum quantity is the MOQ, which affects <i>how much</i> you order, not <i>when</i>.<br><br>When to order (reorder point) and how much to order (order quantum) are two separate decisions.'},

 {t:'orders',tag:'calc',diff:'medium',
  q:'A SKU sells 50 units a day on average, 70 on its best day, and the vendor takes 6 days to deliver. What is the reorder point?',
  given:['Average sales 50 / day','Maximum sales 70 / day','Lead time 6 days'],
  opts:['420 units',
        '300 units',
        '120 units',
        '720 units'],
  why:'<b>Reorder point = lead-time demand + safety stock.</b><div class="work">Lead-time demand = 50 × 6        = 300\nSafety stock     = (70 − 50) × 6  = 120\nReorder point    = 300 + 120      = 420</div>300 forgets the buffer; 120 is the buffer alone; 720 adds the maximum to the average before multiplying (120 × 6).<br><br>Check: 70 × 6 = 420. With this safety-stock method the two always agree.'},

 {t:'orders',tag:'concept',diff:'hard',trap:true,
  q:'With safety stock set as (max daily sales − average daily sales) × lead time, what does the reorder point simplify to?',
  opts:['Maximum daily sales × lead time',
        'Average daily sales × lead time',
        'Maximum minus average daily sales',
        'Average daily sales × lead time × 2'],
  why:'<b>The average cancels out.</b><div class="work">ROP = avg × LT + (max − avg) × LT\n    = avg × LT + max × LT − avg × LT\n    = max × LT</div>So the reorder point is simply the stock you would need if every day of the lead time were your best day. Average × lead time is only the lead-time demand — the trap is forgetting the buffer.<br><br>A quick way to check any reorder-point answer: it should equal peak daily sales × lead time.'},

 {t:'orders',tag:'apply',diff:'medium',
  q:'A vendor’s lead time doubles from 5 to 10 days; daily sales do not change. What happens to the safety stock and the reorder point?',
  opts:['Both double, because each is multiplied by the lead time',
        'Safety stock is unchanged; only the reorder point doubles',
        'Both stay the same, since the rate of sales has not moved',
        'The reorder point doubles while safety stock is halved'],
  why:'<b>Lead time multiplies both terms.</b><div class="work">Lead-time demand = avg × LT          → doubles\nSafety stock     = (max − avg) × LT  → doubles\nReorder point    = max × LT          → doubles</div>A longer lead time means more days of exposure to a demand spike before the stock arrives, so the buffer has to grow too.<br><br>Slow vendors cost working capital: every extra day of lead time is another day of stock held.'},

 {t:'orders',tag:'calc',diff:'medium',trap:true,
  q:'You need 1,500 units to arrive. The vendor has delivered 75% of ordered quantities over recent months. How much should you order?',
  given:['Units needed 1,500','Vendor fill rate 75%'],
  opts:['2,000 units',
        '1,125 units',
        '1,500 units',
        '1,875 units'],
  why:'<b>Plan for the shortfall: divide what you need by the fill rate.</b><div class="work">Order = need ÷ fill rate = 1,500 ÷ 0.75 = 2,000\nCheck: 2,000 × 75% = 1,500 delivered</div>1,125 multiplies by the fill rate — that is what you would <i>receive</i> on a 1,500 order. 1,875 adds 25% of 1,500, which still falls short (1,875 × 75% = 1,406).<br><br>Fill rate is a vendor’s track record; ignoring it builds a stock-out into the plan.'},

 {t:'orders',tag:'apply',diff:'medium',
  q:'After adjusting for fill rate you need to order 1,600 units, but the vendor’s minimum order quantity (MOQ) is 2,000. What should you order, and what is the cost?',
  opts:['2,000 units — the MOQ binds, so you carry extra cover and working capital',
        '1,600 units — the plan rules, and the vendor has to accept the smaller order',
        '400 units now — the gap to the MOQ, then the 1,600 in a second order later',
        'Nothing — skip the order until your need grows large enough to reach 2,000'],
  why:'<b>MOQ is a commercial constraint: you order the larger of your need and the MOQ.</b><div class="work">Order = max(1,600, 2,000) = 2,000\nExcess = 400 units → more days of cover, more working capital</div>Skipping the order is the costly mistake — the stock-out happens anyway. Ordering below MOQ simply gets rejected.<br><br>When the MOQ is far above need, that is the cue to negotiate the MOQ or to order less often.'},

 {t:'orders',tag:'apply',diff:'hard',trap:true,
  q:'There is an open PO for 1,000 units that the vendor has not yet delivered; its fill rate is 80%. How much of that PO should you count on when sizing your next order?',
  opts:['800 units — count open POs at the expected fill rate',
        '1,000 units — an open PO is already a firm commitment',
        'None — open POs are ignored until the goods arrive',
        '1,250 units — gross the PO up by the fill rate'],
  why:'<b>An open PO is stock on the way, but only at the rate the vendor actually delivers.</b><div class="work">Expected receipt = 1,000 × 80% = 800\nNext order covers: requirement − on hand − 800</div>Counting the full 1,000 double-counts stock that may never arrive. Ignoring it leads to over-ordering, and the excess turns into unhealthy inventory when both orders land.<br><br>Every quantity coming <i>from</i> a vendor is discounted by its fill rate; every quantity you <i>send</i> it is grossed up.'}

const CALCS={
 equation:{
  hint:'Move any term and watch users and revenue respond. Each slider is one lever group.',
  ins:[{k:'t',nm:'Traffic (visits / month)',type:'number',def:1000000},
       {k:'c',nm:'Conversion %',type:'range',min:0.5,max:15,step:0.5,def:4},
       {k:'a',nm:'AOV ₹',type:'range',min:100,max:3000,step:50,def:500},
       {k:'f',nm:'Frequency (orders / user / month)',type:'range',min:1,max:6,step:0.5,def:2}],
  run:v=>{
    const u=Math.round(v.t*v.c/100), r=u*v.a*v.f;
    const fmt=n=>n.toLocaleString('en-IN');
    const cr=r>=1e7?(r/1e7).toFixed(2)+' crore':(r/1e5).toFixed(2)+' lakh';
    const tip=v.a<=700?'<span class="vd warn">AOV in the q-commerce band (₹350–700): bundles and combos are the AOV lever.</span>':'';
    return 'Users   = '+fmt(+v.t)+' × '+v.c+'% = '+fmt(u)+'\nRevenue = '+fmt(u)+' × ₹'+fmt(+v.a)+' × '+v.f+
      '<span class="big">₹'+cr+'</span><span class="vd ok">Traffic × Conversion = Users; Users × AOV × Frequency = Revenue</span>'+tip;}},
 mix:{
  hint:'Move share from head brand A to the three tail brands, and watch margin and the head’s share of sales.',
  ins:[{k:'s',nm:'Points of share moved from brand A to the tail',type:'range',min:0,max:12,step:1,def:0}],
  run:v=>{
    const p=[20,22,21,25,26,25,27,28,33,30], c=[20,19,17,10,9,7,6,5,4,3].slice();
    const s=+v.s; c[0]-=s; c[7]+=s/3; c[8]+=s/3; c[9]+=s/3;
    const m=p.reduce((a,x,i)=>a+x*c[i],0)/100, head=c[0]+c[1]+c[2], bps=Math.round((m-23.58)*100);
    const d=head>=50?['ok','Head still near the ~50% rule of thumb.']:head>=45?['warn','Head share slipping: basket starters are getting thin.']:['bad','Head well below 50%: expect orders and AOV to fall.'];
    return 'Blended PPM = Σ (PPM × share)\nHead share  = '+head.toFixed(0)+'%'+
      '<span class="big">'+m.toFixed(1)+'%  ('+(bps>=0?'+':'')+bps+' bps)</span><span class="vd '+d[0]+'">'+d[1]+'</span>';}},
 cover:{
  hint:'Days of cover = stock ÷ daily sales rate. See what an event does to it.',
  ins:[{k:'st',nm:'Stock at FC (units)',type:'number',def:600},
       {k:'r',nm:'BAU daily sales',type:'number',def:20},
       {k:'x',nm:'Event uplift',type:'range',min:1,max:5,step:0.5,def:2}],
  run:v=>{
    if(!+v.r)return 'Daily sales cannot be zero.';
    const b=v.st/v.r, e=v.st/(v.r*v.x);
    const d=e>=21?['ok','Comfortable through a 10-day event.']:e>=10?['warn','Tight: plan inwarding before D-Day (N–60).']:['bad','Stock-out risk during the event.'];
    return 'BAU   '+v.st+' ÷ '+v.r+' = '+b.toFixed(1)+' days\nEvent '+v.st+' ÷ '+(v.r*v.x)+' = '+e.toFixed(1)+' days'+
      '<span class="big">'+e.toFixed(1)+' days in-event</span><span class="vd '+d[0]+'">'+d[1]+'</span>';}},
 rop:{
  hint:'Set the SKU’s sales and the vendor’s terms. See when to order and how much.',
  ins:[{k:'avg',nm:'Average daily sales',type:'number',def:40},
       {k:'mx',nm:'Maximum daily sales',type:'number',def:55},
       {k:'lt',nm:'Lead time (days)',type:'range',min:1,max:21,step:1,def:8},
       {k:'fr',nm:'Vendor fill rate %',type:'range',min:50,max:100,step:5,def:80},
       {k:'moq',nm:'Vendor MOQ',type:'number',def:300},
       {k:'po',nm:'Open PO (units)',type:'number',def:0}],
  run:v=>{
    const avg=+v.avg, mx=Math.max(+v.mx,avg), lt=+v.lt, fr=v.fr/100;
    if(!fr)return 'Fill rate cannot be zero.';
    const ltd=avg*lt, ss=(mx-avg)*lt, rop=ltd+ss, po=Math.round(v.po*fr);
    const net=Math.max(ltd-po,0), gross=Math.ceil(net/fr), ord=net?Math.max(gross,+v.moq):0;
    const note=!net?['ok','Open POs cover the baseline: no new order needed.']
      :ord>gross?['warn','MOQ binds: you carry '+(ord-gross)+' units of extra cover.']
      :['ok','Need grossed up for a '+v.fr+'% fill rate.'];
    return 'Lead-time demand = '+avg+' × '+lt+' = '+ltd+'\nSafety stock     = ('+mx+' − '+avg+') × '+lt+' = '+ss+
      '\nReorder point    = '+rop+'\nOpen PO counted  = '+v.po+' × '+v.fr+'% = '+po+
      '\nOrder            = max('+net+' ÷ '+fr+', MOQ '+v.moq+')'+
      '<span class="big">Order '+ord+' when stock hits '+rop+'</span><span class="vd '+note[0]+'">'+note[1]+'</span>';}}
};

  if(Q.given)box.appendChild(el('div','givens',Q.given.map(g=>'<span>'+g+'</span>').join('')));
  const opts=el('div','opts');box.appendChild(opts);
  const letters=['A','B','C','D','E'],order=shuffle(Q.opts.map((o,i)=>({o,i})));let done=false;
  order.forEach((item,pos)=>{
    const b=el('button','opt','<span class="lt">'+letters[pos]+'</span>'+item.o);
    b.onclick=e=>{
      if(done)return;done=true;box.dataset.done='1';const ok=item.i===0;
      [...opts.children].forEach((c,j)=>{c.disabled=true;
        if(order[j].i===0)c.classList.add('correct');else if(j===pos)c.classList.add('wrong');else c.classList.add('dim');});
      onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
      const why=el('div','why','<h5>'+(ok?'Why this is right →':'Why the answer is what it is →')+'</h5><p>'+Q.why+'</p>');
      box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
    };
    opts.appendChild(b);});
  return box;
}
/* a written question — used by the exam caselets and by the written paper */
function openNode(Q,label,idx,onOpen){
  const card=el('div','openq');
  card.innerHTML='<div class="oh"><span class="on">'+label+'</span><span class="om">'+(Q.marks||5)+' marks</span></div>'+
    '<div class="oq">'+Q.q+'</div>'+(Q.hint?'<p class="hint">💡 '+Q.hint+'</p>':'');
  const ansBox=el('div','ans');
  ansBox.innerHTML='<h5>Model answer</h5>'+(Q.svg&&typeof dsSvg==='function'?dsSvg(Q.svg):'')+Q.ans+
    (Q.rubric?'<div class="rub"><h6>Marking scheme — what the examiner wants</h6><ul>'+
      Q.rubric.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>':'');
  const btn=el('button','btn btn-grad btn-rev','Show model answer ↓');
  btn.onclick=()=>{
    const open=ansBox.classList.toggle('show');
    btn.textContent=open?'Hide model answer ↑':'Show model answer ↓';

/* ---------- keyboard: answer the first unanswered question ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||'')))return;
  if($('#badgeOvl')||$('#cmapOvl'))return;
  const map={'1':0,'2':1,'3':2,'4':3,'5':4,'a':0,'b':1,'c':2,'d':3,'e':4};
  const idx=map[(e.key||'').toLowerCase()];
  if(idx===undefined)return;
  const box=[...document.querySelectorAll('.mcq')].find(b=>!b.dataset.done);
  if(!box)return;
  const btn=box.querySelectorAll('.opt')[idx];
  if(!btn||btn.disabled)return;
  e.preventDefault();
  btn.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});
  btn.click();
});

function renderExam(){

    '<div class="srcrow">'+D_CASES.map(c=>'<span class="src">'+c.cl+'</span>').join('')+'</div>';

          if(traps&&examState.traps===traps)unlock('b_trap');
          buildSidebar();updateFoot();}));

function setScope(mode,id){
  if(mode==='topic'){SCOPE='topic';FOCUS=id; ACTIVE=D_QUIZ.filter(q=>q.t===id);}
  else if(mode==='missed'&&MISSED.length){SCOPE='missed';FOCUS=null; ACTIVE=MISSED.slice();}
  else if(mode==='all'){SCOPE='all';FOCUS=null; ACTIVE=D_QUIZ.slice();}
  else {SCOPE='core';FOCUS=null; ACTIVE=CORE.slice();}
  TRAPS=ACTIVE.filter(q=>q.trap).length;
  renderDrill();
  window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}
function renderDrill(){
  const m=$('#main');m.innerHTML='';
  quizState={answered:0,correct:0,total:ACTIVE.length,traps:0,per:{},missed:[]};
  D_TOPICS.forEach(t=>quizState.per[t.id]={c:0,n:0,a:0});
  ACTIVE.forEach(q=>quizState.per[q.t]&&quizState.per[q.t].n++);
  const scopeName=FOCUS?(D_TOPICS.find(t=>t.id===FOCUS)||{}).name:null;
  const intro=el('div','card');
  intro.innerHTML='<div class="eyebrow">'+(FOCUS?'Focused practice · '+scopeName:(CFG.quizEyebrow||'Practice quiz'))+'</div>'+
    '<h1 class="tt">'+(FOCUS?scopeName+' 🎯':(CFG.quizTitle||'The full paper'))+' 📈</h1>'+
    '<div class="sub">'+(FOCUS
      ? 'Just this section — <b>'+ACTIVE.length+' questions</b>. Use the sidebar to switch sections or go back to the full run.'
      : '<b>'+ACTIVE.length+' questions</b> across '+D_TOPICS.length+' sections. '+(CFG.quizIntro||'Click any section in the sidebar to drill just that block.'))+'</div>'+
    '<div class="sub" style="margin-top:10px">The <b>Why</b> panel under each answer is the real revision — it carries the working and the trap that was being set. '+
    'Watch for <span class="tag trap" style="margin:0">🃏 tricky</span> — those '+TRAPS+' turn on a distinction that is easy to get backwards.</div>'+
    '<div class="sub" style="margin-top:10px">House rules: <b>no option is ever bolded</b>, and <b>the correct answer is never the longest option</b>. Positions reshuffle every attempt. '+
    'Answer with the mouse or press <b>1–4</b> / <b>A–D</b>.</div>'+
    '<div class="srcrow">'+D_TOPICS.map(t=>'<span class="src">'+t.name+'</span>').join('')+'</div>';
  m.appendChild(intro);
  let n=0;
  D_TOPICS.forEach((t,ti)=>{
    const qs=ACTIVE.filter(q=>q.t===t.id);if(!qs.length)return;
    const h=el('div','qgroup-h');h.id='grp-'+t.id;
    h.innerHTML='<span class="gi">'+String(ti+1).padStart(2,'0')+'</span><span class="gt">'+t.name+'</span><span class="gc">'+qs.length+' questions</span>';
    m.appendChild(h);
    let lastScene=null;
    qs.forEach(q=>{n++;
      if(q.scene&&q.scene!==lastScene){m.appendChild(sceneNode(q.scene));lastScene=q.scene;}
      if(!q.scene)lastScene=null;
      const card=el('div','qcard');
      card.appendChild(el('div','qnum','<span>Q'+n+' / '+ACTIVE.length+'</span>'));
      card.appendChild(mcqNode(q,card,ok=>{
        quizState.answered++;quizState.per[q.t].a++;
        if(ok){quizState.correct++;quizState.per[q.t].c++;if(q.trap)quizState.traps++;}
        else quizState.missed.push(q);
        const p=quizState.per[q.t];
        if(p.a===p.n&&p.c===p.n&&TBADGE[q.t])unlock(TBADGE[q.t]);
        if(TRAPS&&quizState.traps===TRAPS)unlock('b_trap');
        buildSidebar();updateFoot();}));

function calcNode(kind,title){
  const C=D_CALCS[kind]; if(!C)return el('div');
  const box=el('div','calc');
  box.innerHTML='<h4>⚡ '+title+'</h4><p class="hint">'+C.hint+'</p>';
  const inWrap=el('div','cin'), out=el('div','cout');
  const state={}; C.ins.forEach(i=>state[i.k]=i.def);
  const redraw=()=>{out.innerHTML=C.run(state);};
  C.ins.forEach(i=>{
    const lab=el('label');
    lab.innerHTML='<span class="nm">'+i.nm+'</span>';
    let inp,val=null;
    if(i.type==='select'){
      inp=el('select');
      inp.style.cssText='flex:2 1 170px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-family:inherit;font-size:13.5px;padding:7px 10px';
      i.opts.forEach(([v,lbl])=>{const o=el('option',null,lbl);o.value=v;inp.appendChild(o);});
      inp.value=i.def;
      inp.onchange=()=>{state[i.k]=inp.value;redraw();};
    } else {
      inp=el('input');
      inp.type=i.type==='range'?'range':'number';
      if(i.type==='range'){inp.min=i.min;inp.max=i.max;inp.step=i.step;}
      inp.value=i.def;
      val=i.type==='range'?el('span','val',String(i.def)):null;
      inp.oninput=()=>{const raw=parseFloat(inp.value);state[i.k]=isNaN(raw)?0:raw;if(val)val.textContent=String(state[i.k]);redraw();};
    }
    lab.appendChild(inp); if(val)lab.appendChild(val);
    inWrap.appendChild(lab);
  });
  box.appendChild(inWrap);box.appendChild(out);redraw();
  return box;
}

      if(FOCUS===t.id){setScope(CORE.length<D_QUIZ.length?'core':'all');return;}
      const h=document.getElementById('grp-'+t.id);
      if(h&&!FOCUS&&inScope){h.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),600);}
      else setScope('topic',t.id);
    };
    d.ondblclick=()=>setScope('topic',t.id);
    list.appendChild(d);});
  $('#pbar').style.width=(ACTIVE.length?(quizState?quizState.answered:0)/ACTIVE.length*100:0)+'%';
}

function scored(){ return MODE==='exam'?examState:(MODE==='drill'?quizState:null); }
function buildFoot(){
  let f=$('#footbar');if(f)f.remove();
  const s=scored(); if(!s)return;
  f=el('div','footbar');f.id='footbar';
  f.innerHTML='<div class="fp"><span class="lbl" id="footLbl">0 / '+s.total+' answered · 0 correct</span><div class="bar"><i id="footBar"></i></div></div>';
  const btn=el('button','btn btn-grad','See Results ↓');btn.id='footBtn';btn.style.opacity=.5;btn.style.pointerEvents='none';btn.onclick=showResults;
  const rt=el('button','btn btn-ghost','↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{MODE==='exam'?renderExam():renderDrill();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  f.appendChild(btn);f.appendChild(rt);document.body.appendChild(f);
}
function updateFoot(){
  const s=scored();if(!s||!$('#footLbl'))return;
  $('#footLbl').textContent=s.answered+' / '+s.total+' answered · '+s.correct+' correct'+(G.best?' · best streak '+G.best:'');
  $('#footBar').style.width=(s.answered/s.total*100)+'%';
  const btn=$('#footBtn');if(s.answered===s.total){btn.style.opacity=1;btn.style.pointerEvents='auto';}
}
function grade(p){
  if(p>=90)return['Outstanding — exam-ready! 🏆','var(--lime)'];
  if(p>=75)return['Strong pass — polish the weak spots. ✅','var(--cyan)'];
  if(p>=60)return['Decent — a focused review will lift this. 📈','var(--gold)'];
  return['Keep going — reread the Why panels and retake. 🔁','var(--red)'];
}
function showResults(){
  const s=scored();if(!s)return;
  const{correct,total,per}=s,pct=Math.round(correct/total*100);
  MISSED=s.missed.slice();
  if(pct>=75)unlock('b_quiz75'); if(pct===100)unlock('b_perfect');
  const rc=$('#resultsCard');rc.className='card';rc.innerHTML='';
  rc.appendChild(el('div',null,'<div class="eyebrow">Results</div><h1 class="tt">Paper complete</h1>'));
  const R=80,C=2*Math.PI*R;const rw=el('div','ring-wrap');
  rw.innerHTML='<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200">'+
    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>'+
    '<circle id="ringArc" cx="100" cy="100" r="'+R+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/>'+
    '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs></svg>'+
    '<div class="mid"><div class="big" id="ringPct">0%</div><div class="sm">'+correct+' / '+total+'</div></div></div>';
  const g=grade(pct),gs=el('div');
  gs.innerHTML='<div class="grade" style="color:'+g[1]+'">'+g[0]+'</div><div class="sub">You answered '+correct+' of '+total+' correctly · longest streak <b>'+G.best+'</b> · tricky questions cleared <b>'+s.traps+'</b>.</div>';
  rw.appendChild(gs);rc.appendChild(rw);
  const meters=el('div','meters');let weak=null;
  const rows = MODE==='exam'
    ? D_CASES.map(c=>({id:c.id,name:c.cl+' · '+c.title.split('—')[0].trim(),p:per[c.id]}))
    : D_TOPICS.map(t=>({id:t.id,name:t.name,p:per[t.id]}));
  rows.forEach(r=>{const p=r.p;if(!p||!p.n)return;const ratio=p.c/p.n;
    if(weak===null||ratio<weak.r)weak={id:r.id,name:r.name,r:ratio};
    const mt=el('div','meter');
    mt.innerHTML='<div class="top"><span>'+r.name+'</span><span class="sc">'+p.c+'/'+p.n+'</span></div><div class="bar"><i data-w="'+(ratio*100)+'"></i></div>';
    meters.appendChild(mt);});
  rc.appendChild(meters);
  if(weak&&weak.r<1){
    const w=el('div','watch');
    w.innerHTML='<h5>Weakest block: '+weak.name+'</h5><p style="color:#ffd9e0">Reread the Why panels there'+(D_CMAP.length?', then check the matching row set in <b>📋 THE MAP</b>':'')+'.'+
      (MODE==='drill'?' <a style="color:var(--cyan);cursor:pointer" id="goWeak">Drill just this section →</a>':'')+'</p>';
    rc.appendChild(w);}
  const row=el('div','row-btns');
  if(MODE==='drill'&&MISSED.length){
    const dr=el('button','btn btn-grad','🎯 Drill the '+MISSED.length+' I missed');
    dr.onclick=()=>setScope('missed');row.appendChild(dr);
  }
  const rt=el('button','btn '+(MODE==='drill'&&MISSED.length?'btn-ghost':'btn-grad'),'↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{MODE==='exam'?renderExam():renderDrill();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  row.appendChild(rt);
  MODES.filter(x=>x.id!==MODE).forEach(x=>{
    const b=el('button','btn btn-ghost',x.label+' →');b.onclick=()=>setMode(x.id);row.appendChild(b);});
  if(D_CMAP.length){const mp=el('button','btn btn-ghost','📋 Open the map');mp.onclick=()=>$('#hMap').click();row.appendChild(mp);}
  rc.appendChild(row);
  rc.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  requestAnimationFrame(()=>{
    const arc=$('#ringArc');arc.style.transition=reduced?'none':'stroke-dashoffset 1.1s var(--spring)';
    arc.style.strokeDashoffset=C*(1-pct/100);
    meters.querySelectorAll('.bar i').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.w+'%',reduced?0:120+i*80));
    const node=$('#ringPct');
    if(reduced)node.textContent=pct+'%';
    else{const t0=performance.now();(function tk(now){const p=Math.min(1,(now-t0)/1100);node.textContent=Math.round(pct*p)+'%';if(p<1)requestAnimationFrame(tk);})(t0);}
  });
  const wb=$('#goWeak');if(wb)wb.onclick=()=>setScope('topic',weak.id);
  if(pct>=75){sfxFanfare();confetti(140);crackers(innerWidth*0.5,innerHeight*0.38,14);mega(pct===100?'👑':'🎉',true);bigCall(pct===100?'FLAWLESS! 👑':'WELL PLAYED! 🎉');}
  else{sfxSad();mega('😬',false);}
}

/* ---------- mode toggle ---------- */
function renderModeToggle(){
  const t=$('#mTog');
  if(MODES.length<2){t.style.display='none';return;}
  t.innerHTML='';
  MODES.forEach(x=>{
    const b=el('button',x.id===MODE?'on':'',x.label);
    b.dataset.mode=x.id;b.onclick=()=>setMode(x.id);
    t.appendChild(b);});
}
function setMode(m){
  if(MODE===m)return;
  MODE=m;
  renderModeToggle();
  const fb=$('#footbar'); if(fb) fb.style.display=(m==='exam'||m==='drill')?'':'none';
  const def=(MODES.find(x=>x.id===m)||{}).side||'Sections';
  $('#sideH').textContent=def;
  if(m==='exam')renderExam(); else if(m==='learn')renderLearn(); else if(m==='paper')renderPaper(); else renderDrill();
  window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}

/* ---------- badges panel ---------- */
$('#hBadge').onclick=()=>{
  if($('#badgeOvl')||$('#cmapOvl'))return;
  const ovl=el('div','ovl');ovl.id='badgeOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Achievements</div><h1 class="tt">Your badges — '+Object.keys(G.badges).length+' / '+BG.length+'</h1>'+
    '<div class="sub">Earned by clearing sections, dodging the tricky questions, running streaks and scoring high on a full attempt.</div>';
  const grid=el('div','badgegrid');
  BG.forEach(b=>{const c=el('div','bcard'+(G.badges[b.id]?' unlocked':''));
    c.innerHTML='<div class="em">'+(G.badges[b.id]?b.em:'🔒')+'</div><div class="bn">'+b.name+'</div><div class="bd">'+b.desc+'</div>';
    grid.appendChild(c);});
  card.appendChild(grid);
  const row=el('div','row-btns');
  const bk=el('button','btn btn-grad','← Back');const close=()=>ovl.remove();

  const x=el('button','x','×');x.onclick=close;

  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* ---------- the map (cheat-sheet) ---------- */
$('#hMap').onclick=()=>{
  if(!D_CMAP.length||$('#cmapOvl'))return;
  const ovl=el('div','ovl');ovl.id='cmapOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Reference</div><h1 class="tt">'+(CFG.mapTitle||'The Map')+' 📋</h1>'+
    '<div class="sub">'+(CFG.mapIntro||'The whole course on one page. <b>Bold</b> marks the bit that usually carries the mark; the blocks marked ★ are the ones worth reading last, on the morning of the paper.')+'</div>';
  D_CMAP.forEach(b=>{
    const blk=el('div','cm-block');
    blk.innerHTML='<h4>'+b.h+'</h4><p class="cm-note">'+b.note+'</p>';
    const sc=el('div','cm-scroll');
    const cells=b.rows.map(r=>r.filter(c=>c!=='')), cols=Math.max(...cells.map(r=>r.length));
    sc.innerHTML='<table><tbody>'+cells.map(r=>
      '<tr>'+r.map((c,i)=>{
        const span=(i===r.length-1&&r.length<cols)?' colspan="'+(cols-i)+'"':'';
        return '<td'+span+'>'+c+'</td>';
      }).join('')+'</tr>').join('')+'</tbody></table>';
    blk.appendChild(sc);card.appendChild(blk);
  });
  const row=el('div','row-btns');
  const bk=el('button','btn btn-grad','← Back');const close=()=>ovl.remove();
  bk.onclick=close;row.appendChild(bk);card.appendChild(row);
  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* =========================================================================
   OPTIONAL HELPER · supply & demand diagram for written answers
   Use in a PAPER or open question as   svg:{d:0.2,s:-0.3,cap:'…'}
   d / s  = shift size, positive = rightward.   line:{p,label} draws a
   price ceiling or floor and marks the Qd / Qs gap.
   ========================================================================= */
function dsSvg(o){
  const W=430,H=300,X0=56,X1=390,Y0=34,Y1=250;
  const mx=q=>X0+q*(X1-X0), my=p=>Y1-p*(Y1-Y0);
  const dP=(q,d)=>0.9-0.8*q+d, sP=(q,s)=>0.1+0.8*q-s;
  const eq=(d,s)=>{const q=(0.8+d+s)/1.6;return{q,p:0.1+0.8*q-s};};
  const line=(f,a)=>'M '+mx(0)+' '+my(f(0,a))+' L '+mx(1)+' '+my(f(1,a));
  const d=o.d||0, s=o.s||0, e0=eq(0,0), e1=eq(d,s);
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="Supply and demand diagram">'+
    '<defs><clipPath id="cp'+(dsSvg.n=(dsSvg.n||0)+1)+'"><rect x="'+X0+'" y="'+Y0+'" width="'+(X1-X0)+'" height="'+(Y1-Y0)+'"/></clipPath></defs>'+
    '<g clip-path="url(#cp'+dsSvg.n+')">';
  g+='<path d="'+line(dP,0)+'" stroke="#22D3EE" stroke-width="2.4" fill="none"/>'+
     '<path d="'+line(sP,0)+'" stroke="#FBBF24" stroke-width="2.4" fill="none"/>';
  if(d)g+='<path d="'+line(dP,d)+'" stroke="#22D3EE" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  if(s)g+='<path d="'+line(sP,s)+'" stroke="#FBBF24" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  const dot=(q,p,c,r)=>'<circle cx="'+mx(q)+'" cy="'+my(p)+'" r="'+(r||5)+'" fill="'+c+'"/>';
  const dash=(q,p,c)=>'<path d="M '+X0+' '+my(p)+' L '+mx(q)+' '+my(p)+' L '+mx(q)+' '+Y1+'" stroke="'+c+'" stroke-width="1.2" stroke-dasharray="3 4" fill="none" opacity=".6"/>';
  if(o.line){
    const lp=o.line.p, qd=(0.9-lp)/0.8, qs=(lp-0.1)/0.8;
    g+='<path d="M '+X0+' '+my(lp)+' L '+X1+' '+my(lp)+'" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="8 4" fill="none"/>'+
       '<path d="M '+mx(Math.min(qd,qs))+' '+my(lp)+' L '+mx(Math.max(qd,qs))+' '+my(lp)+'" stroke="#FB7185" stroke-width="7" opacity=".3" fill="none"/>'+
       dot(qs,lp,'#FB7185',4)+dot(qd,lp,'#FB7185',4)+
       '<text x="'+mx(qs)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qs</text>'+
       '<text x="'+mx(qd)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qd</text>';
  }
  g+=dash(e0.q,e0.p,'#9AA6C9')+dot(e0.q,e0.p,'#E7ECFF');
  if(d||s)g+=dash(e1.q,e1.p,'#4ADE80')+dot(e1.q,e1.p,'#4ADE80',6);
  g+='</g>';
  g+='<path d="M '+X0+' '+Y0+' L '+X0+' '+Y1+' L '+X1+' '+Y1+'" stroke="#9AA6C9" stroke-width="1.6" fill="none"/>'+
     '<text x="'+(X0-8)+'" y="'+(Y0+10)+'" fill="#9AA6C9" font-size="12" text-anchor="end">P</text>'+
     '<text x="'+X1+'" y="'+(Y1+20)+'" fill="#9AA6C9" font-size="12" text-anchor="end">Q</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,0))-8)+'" fill="#22D3EE" font-size="12" text-anchor="end">D</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,0))+16)+'" fill="#FBBF24" font-size="12" text-anchor="end">S</text>';
  if(d)g+='<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,d))+(d>0?-8:16))+'" fill="#22D3EE" font-size="12" text-anchor="end">D₂</text>';
  if(s)g+='<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,s))+(s>0?16:-8))+'" fill="#FBBF24" font-size="12" text-anchor="end">S₂</text>';
  if(o.line)g+='<text x="'+(X0+8)+'" y="'+(my(o.line.p)-8)+'" fill="#FB7185" font-size="12">'+o.line.label+'</text>';
  g+='</svg>';
  return '<div class="dsg">'+g+'<div class="cap">'+(o.cap||'')+'</div></div>';
}

if(!D_CMAP.length)$('#hMap').style.display='none';
renderModeToggle();
$('#sideH').textContent=(MODES.find(x=>x.id===MODE)||{}).side||'Sections';
renderHUD();
if(MODE==='exam')renderExam(); else if(MODE==='learn')renderLearn(); else if(MODE==='paper')renderPaper(); else renderDrill();
</script>
