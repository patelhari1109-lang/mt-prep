<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Trade Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B1A; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#F472B6;
  --lime:#4ADE80; --red:#FB7185; --gold:#FBBF24;
  --grad:linear-gradient(100deg,#22D3EE,#8B5CF6,#F472B6);
  --glass:rgba(255,255,255,.05); --glass-brd:rgba(255,255,255,.12);
  --ink:#E7ECFF; --muted:#9AA6C9; --spring:cubic-bezier(.22,1.4,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s var(--spring) infinite alternate}
.orb.a{width:520px;height:520px;background:#1e3a8a;top:-160px;left:-120px}
.orb.b{width:460px;height:460px;background:#6d28d9;bottom:-180px;right:-100px;animation-duration:32s}
.orb.c{width:380px;height:380px;background:#0e7490;top:40%;left:55%;animation-duration:29s}
.orb.d{width:300px;height:300px;background:#be185d;top:12%;right:18%;animation-duration:35s;opacity:.35}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
.grid-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(139,92,246,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.09) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%)}
/* ===== header w/ game HUD ===== */
header{position:sticky;top:0;z-index:50;padding:2px;margin:12px;border-radius:20px;background:var(--grad);background-size:300% 300%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.hdr-in{background:rgba(9,13,28,.88);backdrop-filter:blur(14px);border-radius:18px;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:180px}
.brand .k{font-size:11px;letter-spacing:.26em;color:var(--cyan);font-weight:600}
.brand .t{font-size:18px;font-weight:700}
.brand .s{font-size:11px;color:var(--muted)}
.hud{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:170px}
.lvl .top{display:flex;justify-content:space-between;font-size:11px}
.lvl .top .ti{font-weight:700;color:#fff}
.lvl .top .xp{font-family:'JetBrains Mono',monospace;color:var(--gold)}
.lvl .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
.lvl .bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
@keyframes shim{to{background-position:200% 0}}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:12px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;transition:.3s}
.chip.streak{color:var(--gold)}
.chip.streak.t1{border-color:rgba(251,191,36,.45);box-shadow:0 0 14px rgba(251,191,36,.22)}
.chip.streak.t2{border-color:rgba(251,146,60,.7);box-shadow:0 0 20px rgba(251,146,60,.38);color:#FDBA74}
.chip.streak.t3{border-color:rgba(244,114,182,.85);box-shadow:0 0 28px rgba(244,114,182,.5);color:#FBCFE8;animation:pulseHot 1.1s ease-in-out infinite alternate}
@keyframes pulseHot{to{transform:scale(1.07)}}
.chip.badge,.chip.snd{cursor:pointer}
.chip.badge{color:var(--cyan)}
.chip.snd{color:var(--pink)}
.chip.cmap{color:var(--lime);cursor:pointer}
.chip.cmap:hover{border-color:rgba(74,222,128,.6)}
.chip.snd.off{color:var(--muted);opacity:.65}
.chip .lab{font-size:10px;letter-spacing:.12em;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600}
/* ===== layout ===== */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:6px 18px 96px;max-width:1320px;margin:0 auto}
aside{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 124px);overflow-y:auto;padding-right:4px}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:6px}
.side-h{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:4px 0 10px 6px}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 6px 16px}
.pbar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
.topic{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:7px;border-radius:13px;background:var(--glass);border:1px solid transparent;cursor:pointer;transition:.25s;font-size:13.5px}
.topic:hover{border-color:var(--glass-brd);transform:translateX(3px)}
.topic .idx{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.topic.done .idx{background:var(--grad);color:#08111f}
.topic .nm{flex:1;line-height:1.2;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic .nm small{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.topic .flame{font-style:normal;font-size:12px}
.topic .sc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--cyan)}
.topic.done{border-color:rgba(74,222,128,.34)}
.topic.hot{border-color:rgba(251,191,36,.3)}
main{min-width:0}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;padding:26px 28px;backdrop-filter:blur(10px);margin-bottom:18px;animation:popIn .5s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:6px}
h1.tt{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
.sub b{color:#D6DDF7}
.srcrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.src{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 11px;border-radius:999px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.45);color:#d6ccff}
.watch{margin-top:14px;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.45);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px}
.watch h5{margin:0 0 4px;color:var(--red);font-size:14px} .watch p{margin:0;font-size:13.5px;color:#ffd9e0;line-height:1.5}
/* ===== buttons / mcq ===== */
.btn{border:0;font-family:inherit;font-weight:600;cursor:pointer;border-radius:12px;transition:.25s;font-size:14px}
.btn-grad{background:var(--grad);background-size:200% auto;color:#08111f;padding:12px 24px;box-shadow:0 6px 24px rgba(139,92,246,.35)}
.btn-grad:hover{background-position:100% center;transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);color:var(--ink);padding:11px 20px}
.btn-ghost:hover{border-color:var(--cyan);color:#fff}
.row-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.mcq{margin-top:8px}.mcq .q{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5}
.mcq .q b{color:#fff}
.givens{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.givens span{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 9px;border-radius:8px;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.28);color:#bfe9f4}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.05em;padding:3px 10px;border-radius:999px;margin:0 6px 10px 0}
.tag.concept{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
.tag.apply{background:rgba(251,191,36,.14);color:var(--gold);border:1px solid rgba(251,191,36,.4)}
.tag.calc{background:rgba(74,222,128,.14);color:var(--lime);border:1px solid rgba(74,222,128,.45)}
.tag.case{background:rgba(244,114,182,.16);color:var(--pink);border:1px solid rgba(244,114,182,.5)}
.tag.easy{background:rgba(74,222,128,.13);color:var(--lime)}.tag.medium{background:rgba(251,191,36,.13);color:var(--gold)}.tag.hard{background:rgba(251,113,133,.13);color:var(--red)}
.tag.trap{background:rgba(139,92,246,.2);color:#ddd0ff;border:1px solid rgba(139,92,246,.6);animation:trapGlow 2.2s ease-in-out infinite alternate}
@keyframes trapGlow{to{box-shadow:0 0 14px rgba(139,92,246,.55)}}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;position:relative;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}.opt:disabled{cursor:default}
.opt .lt{font-family:'JetBrains Mono',monospace;color:var(--violet);font-weight:700;margin-right:10px}
.opt.correct{border-color:var(--lime);background:rgba(74,222,128,.16);box-shadow:0 0 34px rgba(74,222,128,.4);animation:popBig .6s var(--spring)}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.2);box-shadow:0 0 34px rgba(251,113,133,.4);animation:shakeHard .55s}.opt.dim{opacity:.32}
@keyframes popBig{0%{transform:scale(1)}30%{transform:scale(1.075)}55%{transform:scale(.99)}75%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakeHard{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-14px) rotate(-1.4deg)}26%{transform:translateX(14px) rotate(1.4deg)}42%{transform:translateX(-11px) rotate(-1deg)}58%{transform:translateX(11px) rotate(1deg)}74%{transform:translateX(-6px)}88%{transform:translateX(6px)}}
.why{margin-top:14px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:14px 16px;opacity:0;transform:translateY(8px);transition:.4s;max-height:0;overflow:hidden}
.why.show{opacity:1;transform:none;max-height:900px}
.why h5{margin:0 0 4px;color:var(--gold);font-size:13px}.why p{margin:0 0 8px;font-size:13.5px;color:#ffeec4;line-height:1.6}
.why p:last-child{margin-bottom:0}
.why .work{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#ffe0a3;background:rgba(0,0,0,.28);border-radius:8px;padding:9px 11px;margin:8px 0;line-height:1.7;overflow-x:auto;white-space:pre-wrap}
.floater{position:fixed;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;pointer-events:none;z-index:999;text-shadow:0 3px 14px rgba(0,0,0,.6);animation:rise 1.25s var(--spring) forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-110px) scale(1.6)}}
/* ===== BIG REACTION TEXT ===== */
.bigcall{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:1000;pointer-events:none;font-weight:700;
  font-size:clamp(38px,9vw,86px);letter-spacing:-.01em;text-align:center;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:callIn 1.6s var(--spring) forwards;filter:drop-shadow(0 0 32px rgba(139,92,246,.75))}
.bigcall.bad{background:linear-gradient(100deg,#FB7185,#F43F5E,#FDA4AF);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 34px rgba(251,113,133,.8));animation:callBad 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes callIn{0%{opacity:0;transform:translateX(-50%) scale(.25) rotate(-9deg)}
  18%{opacity:1;transform:translateX(-50%) scale(1.28) rotate(3deg)}
  32%{transform:translateX(-50%) scale(1) rotate(-1.5deg)}
  44%{transform:translateX(-50%) scale(1.1) rotate(0deg)}
  80%{opacity:1;transform:translateX(-50%) scale(1.02)}
  100%{opacity:0;transform:translateX(-50%) scale(1.14) translateY(-46px)}}
@keyframes callBad{0%{opacity:0;transform:translateX(-50%) scale(2.2) rotate(6deg)}
  16%{opacity:1;transform:translateX(-50%) scale(.9) rotate(-4deg)}
  26%{transform:translateX(-50%) scale(1.12) rotate(3deg)}
  38%{transform:translateX(-50%) scale(.98) rotate(-2deg)}
  50%{transform:translateX(-50%) scale(1.04) rotate(0deg)}
  82%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.86) translateY(34px)}}
/* ===== GIANT STAMPS — the exaggerated reaction ===== */
.mega{position:fixed;left:50%;top:47%;z-index:999;pointer-events:none;user-select:none;line-height:1;
  font-size:clamp(150px,33vw,330px);filter:drop-shadow(0 22px 48px rgba(0,0,0,.75))}
.mega.down{animation:megaDown 1.5s cubic-bezier(.18,.85,.3,1) forwards}
@keyframes megaDown{
  0%{opacity:0;transform:translate(-50%,-160%) scale(.35) rotate(-42deg)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.42) rotate(9deg)}
  25%{transform:translate(-50%,-50%) scale(1.02) rotate(-7deg)}
  36%{transform:translate(-50%,-50%) scale(1.24) rotate(5deg)}
  47%{transform:translate(-50%,-50%) scale(1.08) rotate(-3deg)}
  58%{transform:translate(-50%,-50%) scale(1.15) rotate(0deg)}
  78%{opacity:.95;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,26%) scale(.82) rotate(17deg)}}
.mega.up{animation:megaUp 1.25s cubic-bezier(.2,1.35,.35,1) forwards}
@keyframes megaUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-16deg)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(7deg)}
  34%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
  48%{transform:translate(-50%,-50%) scale(1.14) rotate(0deg)}
  72%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-130%) scale(1.3) rotate(6deg)}}
/* ===== flashes / vignettes ===== */
.flash{position:fixed;inset:0;z-index:997;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.34),transparent 62%);animation:flashF .55s ease-out forwards}
@keyframes flashF{to{opacity:0}}
.greenflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(74,222,128,.30),transparent 64%);animation:flashF .6s ease-out forwards}
.redflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(251,113,133,.34),transparent 58%);animation:flashF .7s ease-out forwards}
.vignette{position:fixed;inset:0;z-index:996;pointer-events:none;box-shadow:inset 0 0 190px 60px rgba(244,63,94,.75);animation:vig .95s ease-out forwards}
@keyframes vig{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.vignette.good{box-shadow:inset 0 0 180px 54px rgba(74,222,128,.62);animation-duration:.85s}
.shakeit{animation:bodyShake .48s}
@keyframes bodyShake{0%,100%{transform:translate(0,0)}12%{transform:translate(-13px,4px) rotate(-.5deg)}26%{transform:translate(13px,-4px) rotate(.5deg)}40%{transform:translate(-10px,3px)}54%{transform:translate(10px,-3px)}68%{transform:translate(-6px,2px)}84%{transform:translate(6px,-2px)}}
.zoomit{animation:bodyZoom .5s var(--spring)}
@keyframes bodyZoom{0%,100%{transform:scale(1)}35%{transform:scale(1.014)}}
/* ===== crackers ===== */
.spark{position:fixed;z-index:998;pointer-events:none;animation:crkX var(--d) linear forwards}
.spark i{display:block;border-radius:50%;animation:crkY var(--d) cubic-bezier(.14,.72,.36,1) forwards, crkF var(--d) ease-in forwards}
@keyframes crkX{from{transform:translateX(0)}to{transform:translateX(var(--tx))}}
@keyframes crkY{0%{transform:translateY(0)}58%{transform:translateY(var(--ty))}100%{transform:translateY(calc(var(--ty) + 96px))}}
@keyframes crkF{0%,55%{opacity:1}100%{opacity:0}}
.boom{position:fixed;z-index:998;pointer-events:none;border:3px solid #fff;border-radius:50%;margin:0;animation:crkR .68s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes crkR{from{transform:translate(-50%,-50%) scale(.05);opacity:.98}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.rocket{position:fixed;z-index:998;pointer-events:none;width:4px;height:16px;border-radius:3px;margin-left:-2px;animation:crkL var(--rd) cubic-bezier(.25,.5,.4,1) forwards}
@keyframes crkL{from{transform:translateY(0) scaleY(1.35);opacity:.15}60%{opacity:1}to{transform:translateY(var(--ry)) scaleY(.7);opacity:.85}}
/* ===== thumbs — the shower ===== */
.tdown{position:fixed;z-index:998;pointer-events:none;user-select:none;line-height:1;filter:drop-shadow(0 3px 9px rgba(0,0,0,.6))}
.tdown.pop{animation:tdPop var(--d) cubic-bezier(.2,.7,.35,1) forwards}
@keyframes tdPop{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.25)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1.25)}}
.tdown.rain{animation:tdRain var(--d) linear forwards}
@keyframes tdRain{0%{opacity:0;transform:translateY(-40px) rotate(0deg)}
  9%{opacity:1}
  86%{opacity:1}
  100%{opacity:0;transform:translateY(var(--ty)) rotate(var(--rot))}}
.confetti{position:fixed;width:11px;height:15px;top:-20px;z-index:998;pointer-events:none;border-radius:2px}
/* ===== toast ===== */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160px);z-index:1001;background:rgba(9,13,28,.95);border:1px solid var(--gold);border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .5s var(--spring);max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .em{font-size:26px}.toast .tt{font-weight:700}.toast .td{font-size:12px;color:var(--muted)}
/* ===== quiz ===== */
.qgroup-h{display:flex;align-items:center;gap:12px;margin:26px 2px 12px;scroll-margin-top:110px}
.qgroup-h .gi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--grad);color:#08111f;font-size:13px}
.qgroup-h .gt{font-size:17px;font-weight:700}.qgroup-h .gc{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.qcard{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:20px 22px;margin-bottom:14px;backdrop-filter:blur(8px);transition:box-shadow .35s,border-color .35s}
.qcard.hitgood{border-color:rgba(74,222,128,.55);box-shadow:0 0 40px rgba(74,222,128,.22)}
.qcard.hitbad{border-color:rgba(251,113,133,.55);box-shadow:0 0 40px rgba(251,113,133,.22)}
.qnum{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.footbar{position:fixed;bottom:0;left:0;right:0;z-index:60;padding:10px 18px;background:rgba(9,13,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-brd);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.footbar .fp{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px}
.footbar .fp .lbl{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.footbar .fp .bar{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.footbar .fp .bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--grad);transition:width .5s var(--spring)}
.ring-wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:200px;height:200px}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .big{font-size:44px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ring .mid .sm{font-size:12px;color:var(--muted);letter-spacing:.1em}
.grade{font-size:24px;font-weight:700;margin:4px 0}
.meters{margin-top:24px;display:grid;gap:12px}

/* scope switch + focus states on the section list */

/* ===== exam-day panel ===== */
.plan{display:grid;gap:11px;margin-top:14px}
.pstep{display:flex;gap:13px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);
  border-radius:13px;padding:13px 15px}

/* =========================================================================
   SLIMMER HEADER + THE MAP BUTTON
   The map is the single most useful thing in the app, so it gets a real
   button of its own between the title and the mode toggle — never a chip
   in the HUD, and never label-less on a phone. Everything else in the bar
   loses a few pixels to pay for it.
   ========================================================================= */
header{margin:8px;border-radius:16px;padding:2px}
.hdr-in{padding:7px 12px;gap:10px 12px;border-radius:14px}

/* the map button itself */
.mapbtn{display:flex;align-items:center;gap:9px;cursor:pointer;border:0;font-family:inherit;

  background:var(--grad);background-size:220% auto;

  animation:mapPulse 2.6s ease-in-out infinite}

  box-shadow:0 9px 30px rgba(139,92,246,.65);animation:none}

.mapbtn .mi{font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}

@keyframes mapPulse{
  0%,100%{box-shadow:0 5px 20px rgba(139,92,246,.45)}
  50%{box-shadow:0 5px 26px rgba(34,211,238,.75),0 0 0 4px rgba(34,211,238,.16)}}

/* =========================================================================

   table has to look like a table, not like prose.

.caselet{background:rgba(244,114,182,.07);border:1px solid rgba(244,114,182,.4);border-left:4px solid var(--pink);
  border-radius:16px;padding:18px 20px;margin:26px 2px 14px;animation:popIn .45s var(--spring) both;scroll-margin-top:86px}

.caselet .brief{font-size:13.8px;line-height:1.62;color:#F5D9E6}

      <span class="t">Modern Trade<span class="tagline"> · MT1–MT4</span></span>
    </div>

      <span class="mi">📋</span>
      <span class="mt"><b>THE MAP</b><small>full cheat-sheet</small></span>
    </button>
    <div class="mtog" id="mTog"></div>

        <div class="top"><span class="ti" id="hLvl">Intern</span><span class="xp" id="hXp">0 XP</span></div>

<script>
/* =========================================================================
   Modern Trade — built on the reusable quiz template
   ~/projects/quiz-template · see SPEC.md for the authoring rules

   Modules switch on automatically from the data that exists:
     CASES   → ✍ Exam Paper     (caselets + data tables + written answers)
     QUIZ    → ⚙ Practice Quiz  (standalone MCQ bank, needs TOPICS)
     LESSONS → ◈ Prep Material  (lessons + live calculators, needs TOPICS)
     PAPER   → ✎ Written Paper  (long-form questions + model answers)
     CMAP    → 📋 THE MAP        (cheat-sheet overlay)
   ========================================================================= */
/* ---------- tiny helpers, loaded before everything else ---------- */
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* =========================================================================
   SOUND — synthesised with WebAudio, no files, no network.
   The context is created lazily on the first click, which satisfies autoplay.

let AC=null, SOUND=true;
try{ if(localStorage.getItem('quiz_sound')==='0') SOUND=false; }catch(e){}
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq,at,dur,type,vol,glideTo){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(at,dur,vol,freq){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at, n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
  const g=c.createGain(); g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}
/* correct — a major arpeggio that climbs higher the longer the streak runs */
function sfxRight(streak){
  if(!SOUND) return;
  const base=523.25*Math.pow(2,Math.min(4,Math.floor((streak-1)/4))/12*2);
  const notes=[1,1.26,1.5,2];                         // root, M3, P5, octave
  notes.forEach((m,i)=>tone(base*m,i*0.055,0.26,'triangle',0.17));
  if(streak>=3) tone(base*2.52,0.235,0.34,'sine',0.13);
  if(streak>=7){ tone(base*3,0.30,0.4,'sine',0.11); noise(0,0.16,0.09,2600); }
  if(streak>=12){ [0,.09,.18].forEach((t,i)=>tone(base*(3+i*0.5),0.34+t,0.3,'triangle',0.09)); }
}
/* wrong — a fat descending buzzer plus a thud */
function sfxWrong(){
  if(!SOUND) return;
  tone(196,0,0.42,'sawtooth',0.20,72);
  tone(146.8,0.03,0.46,'square',0.13,58);
  noise(0,0.28,0.26,420);
  tone(92,0.16,0.3,'sine',0.16,46);
}
function sfxBadge(){ if(!SOUND) return; [784,988,1175,1568].forEach((f,i)=>tone(f,i*0.075,0.3,'triangle',0.15)); }
function sfxLevel(){ if(!SOUND) return; [392,523,659,784,1047].forEach((f,i)=>tone(f,i*0.07,0.34,'sine',0.16)); }
function sfxFanfare(){ if(!SOUND) return;
  [[523,0],[659,.1],[784,.2],[1047,.3],[784,.46],[1047,.56],[1319,.66]].forEach(([f,t])=>tone(f,t,0.5,'triangle',0.16));
  noise(0.3,0.5,0.08,3200); }
function sfxSad(){ if(!SOUND) return; [440,392,349,294].forEach((f,i)=>tone(f,i*0.16,0.4,'triangle',0.15)); }

/* ---------------- HUD ---------------- */
function levelInfo(){let idx=0;for(let i=0;i<LV.length;i++)if(G.xp>=LV[i].xp)idx=i;
  const cur=LV[idx], nxt=LV[idx+1];
  const pct=nxt?((G.xp-cur.xp)/(nxt.xp-cur.xp))*100:100;
  return {idx,title:cur.title,pct:Math.max(0,Math.min(100,pct))};}
function renderHUD(){const li=levelInfo();
  $('#hLvl').textContent=li.title; $('#hXp').textContent=G.xp+' XP'; $('#hBar').style.width=li.pct+'%';
  $('#hStreakN').textContent=G.streak;
  const c=$('#hStreak');c.classList.remove('t1','t2','t3');
  if(G.streak>=12)c.classList.add('t3'); else if(G.streak>=7)c.classList.add('t2'); else if(G.streak>=3)c.classList.add('t1');
  $('#hStreakEm').textContent=G.streak>=12?'☄️':(G.streak>=7?'💥':'🔥');
  $('#hBadgeN').textContent=Object.keys(G.badges).length;
  $('#hSndEm').textContent=SOUND?'🔊':'🔇';
  $('#hSnd').classList.toggle('off',!SOUND);}

let toastQ=[],toasting=false;
function toast(em,tt,td){toastQ.push([em,tt,td]);if(!toasting)nextToast();}
function nextToast(){if(!toastQ.length){toasting=false;return;}toasting=true;const[em,tt,td]=toastQ.shift();
  $('#toEm').textContent=em;$('#toTt').textContent=tt;$('#toTd').textContent=td;const t=$('#toast');
  t.classList.add('show');setTimeout(()=>{t.classList.remove('show');setTimeout(nextToast,380);},1900);}
function unlock(id){if(G.badges[id])return;const b=BG.find(x=>x.id===id);if(!b)return;G.badges[id]=1;
  G.xp+=50;toast(b.em,'Badge unlocked: '+b.name,'+50 XP · '+b.desc);sfxBadge();renderHUD();}
function levelUpCheck(before){const a=levelInfo().idx;if(a>before){toast('🚀','Level up! '+LV[a].title,'You reached a new rank.');sfxLevel();}}
function floater(x,y,txt,color){const f=el('div','floater',txt);f.style.left=x+'px';f.style.top=y+'px';f.style.color=color;document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}
function bigCall(txt,bad){if(reduced)return;const b=el('div','bigcall'+(bad?' bad':''),txt);document.body.appendChild(b);setTimeout(()=>b.remove(),1700);}
function mega(emo,up){if(reduced)return;const m=el('div','mega '+(up?'up':'down'),emo);document.body.appendChild(m);setTimeout(()=>m.remove(),1600);}

/* the shout-outs */
const CALLS={2:'NICE! ✌️',3:'TRIPLE! 🔥',4:'HEATING UP! 🌡️',5:'ON FIRE! 🔥🔥',6:'RAMPAGE! 💥',
  7:'UNSTOPPABLE! ⚡',8:'MONSTROUS! 👹',10:'GODLIKE! 🌌',12:'INFERNO! ☄️',15:'LEGENDARY! 👑',18:'ELASTIC GOD! 🏛️'};
const CHEERS=['YES! 🎉','BOOM! 💥','CLEAN! ✨','SHARP! 🎯','NAILED IT! 🔨','CORRECT! ✅','TOO EASY! 😎','CHEF’S KISS 👌'];
const TAUNTS=['NOPE! 👎','OOF. 👎','BONK! 👎','YIKES. 👎','BRUTAL. 👎','DENIED! 👎','OUCH! 👎','NOT TODAY. 👎'];

function onAnswer(ok,x,y,card){
  if(ok){
    G.streak++; G.best=Math.max(G.best,G.streak);
    const bonus=Math.min(30,Math.max(0,(G.streak-1)*4));    // streak bonus grows with the run
    const gain=10+bonus;
    const before=levelInfo().idx; G.xp+=gain; levelUpCheck(before);
    sfxRight(G.streak);
    crackers(x,y,G.streak);
    greenFlash(G.streak);
    mega(G.streak>=12?'🏆':(G.streak>=7?'💥':(G.streak>=3?'🔥':'👍')),true);
    floater(x,y,'+'+gain+' XP','var(--lime)');
    bigCall(CALLS[G.streak]||rnd(CHEERS));
    if(card){card.classList.add('hitgood');setTimeout(()=>card.classList.remove('hitgood'),1400);}
    if(!G.badges.b_first)unlock('b_first');
    if(G.streak===5)unlock('b_streak5');
    if(G.streak===10)unlock('b_streak10');
    if(G.streak===15)unlock('b_streak15');
    renderHUD();
  } else {
    const lost=G.streak;
    G.streak=0;
    sfxWrong();
    thumbsDown(x,y,lost);
    mega('👎',false);
    bigCall(lost>=3?'STREAK BROKEN! 👎':rnd(TAUNTS),true);
    floater(x,y,lost>=3?'−'+lost+' streak':'✕','var(--red)');
    if(card){card.classList.add('hitbad');setTimeout(()=>card.classList.remove('hitbad'),1400);}
    renderHUD();
  }
}

/* ---------- 🎆 crackers — intensity scales with the streak ---------- */
const CRK=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24','#FB7185','#FFFFFF'];
function burstAt(x,y,n,spread,size){
  const ring=el('div','boom');ring.style.left=x+'px';ring.style.top=y+'px';
  const rs=spread*1.6;ring.style.width=rs+'px';ring.style.height=rs+'px';
  ring.style.borderColor=rnd(CRK);document.body.appendChild(ring);setTimeout(()=>ring.remove(),740);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+Math.random()*0.4;
    const r=spread*(0.5+Math.random()*0.75);
    const s=el('div','spark'),dot=el('i');s.appendChild(dot);
    s.style.left=x+'px';s.style.top=y+'px';
    const col=rnd(CRK),w=size*(0.6+Math.random()*0.9);
    dot.style.background=col;dot.style.boxShadow='0 0 10px '+col+',0 0 22px '+col;
    dot.style.width=w+'px';dot.style.height=w+'px';
    const d=0.8+Math.random()*0.6;
    s.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--ty',(Math.sin(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--d',d.toFixed(2)+'s');
    document.body.appendChild(s);setTimeout(()=>s.remove(),(d+0.4)*1000);
  }
}
function launchTo(x,y,n,spread,size){
  const rd=0.30+Math.random()*0.18;
  const rk=el('div','rocket');rk.style.left=x+'px';rk.style.top=innerHeight+'px';
  const col=rnd(CRK);rk.style.background=col;rk.style.boxShadow='0 0 12px '+col;
  rk.style.setProperty('--ry',(y-innerHeight)+'px');rk.style.setProperty('--rd',rd.toFixed(2)+'s');
  document.body.appendChild(rk);
  setTimeout(()=>{rk.remove();burstAt(x,y,n,spread,size);if(SOUND)noise(0,0.12,0.07,2200);},rd*1000);
}
function flash(){if(reduced)return;const f=el('div','flash');document.body.appendChild(f);setTimeout(()=>f.remove(),580);}
function greenFlash(streak){
  if(reduced)return;
  const g=el('div','greenflash');document.body.appendChild(g);setTimeout(()=>g.remove(),620);
  const v=el('div','vignette good');document.body.appendChild(v);setTimeout(()=>v.remove(),900);
  document.body.classList.add('zoomit');setTimeout(()=>document.body.classList.remove('zoomit'),520);
  if(streak>=7)flash();
}
/* tier 0: 2 shells · tier 1 (3+): 3 · tier 2 (7+): 5 + white flash
   tier 3 (12+): 8 shells, wider, plus a confetti barrage                    */
function crackers(x,y,streak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const s=streak||1;
  const tier = s>=12?3 : s>=7?2 : s>=3?1 : 0;
  const shells=[2,3,5,8][tier];
  const grow=1.25+tier*0.32;
  burstAt(x,y,Math.round(20*grow),Math.round(120*grow),7+tier);
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<shells;i++){
    const sx=W*(0.10+Math.random()*0.80), sy=H*(0.10+Math.random()*0.32);
    setTimeout(()=>launchTo(sx,sy,Math.round(26*grow),Math.round(150*grow),6+tier),70+i*130);
  }
  if(tier>=1)confetti(24*tier);
  if(tier>=3){
    confetti(90);
    setTimeout(()=>{for(let i=0;i<4;i++){const sx=W*(0.12+Math.random()*0.76),sy=H*(0.08+Math.random()*0.30);
      setTimeout(()=>launchTo(sx,sy,36,225,9),i*120);}},720);
  }
}
function confetti(count){if(reduced)return;const cols=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24'];const n=count||100;
  for(let i=0;i<n;i++){const c=el('div','confetti');c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.transform='rotate('+(Math.random()*360)+'deg)';
    const d=2.4+Math.random()*1.8;c.style.animation='fall '+d+'s linear '+(Math.random()*0.6)+'s forwards';document.body.appendChild(c);setTimeout(()=>c.remove(),(d+1)*1000);}}
const cst=document.createElement('style');cst.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}';document.head.appendChild(cst);

/* ---------- 👎 thumbs down — a full shower, always heavy ---------- */
function thumbsDown(x,y,lostStreak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const rf=el('div','redflash');document.body.appendChild(rf);setTimeout(()=>rf.remove(),720);
  const vg=el('div','vignette');document.body.appendChild(vg);setTimeout(()=>vg.remove(),980);
  document.body.classList.add('shakeit');setTimeout(()=>document.body.classList.remove('shakeit'),500);
  /* the bigger the streak you just torched, the heavier the shower */
  const extra=Math.min(26,(lostStreak||0)*3);
  const popN=22+extra, rainN=20+extra;
  for(let i=0;i<popN;i++){                       // burst outward from the tapped option
    const t=el('div','tdown pop','👎');
    const ang=(i/popN)*Math.PI*2+Math.random()*0.5;
    const r=110+Math.random()*230;
    const d=1.0+Math.random()*0.8;
    t.style.left=x+'px';t.style.top=y+'px';
    t.style.fontSize=(24+Math.random()*38).toFixed(0)+'px';
    t.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    t.style.setProperty('--ty',(Math.sin(ang)*r+150).toFixed(1)+'px');
    t.style.setProperty('--rot',((Math.random()-0.5)*720).toFixed(0)+'deg');
    t.style.setProperty('--d',d.toFixed(2)+'s');
    document.body.appendChild(t);setTimeout(()=>t.remove(),(d+0.3)*1000);
  }
  for(let i=0;i<rainN;i++){                      // and a shower down the whole screen
    const t=el('div','tdown rain','👎');
    const d=1.5+Math.random()*1.6;
    t.style.left=(Math.random()*96)+'vw';t.style.top='-50px';
    t.style.fontSize=(22+Math.random()*40).toFixed(0)+'px';
    t.style.setProperty('--ty',(innerHeight+150)+'px');
    t.style.setProperty('--rot',((Math.random()-0.5)*900).toFixed(0)+'deg');
    t.style.setProperty('--d',d.toFixed(2)+'s');
    t.style.animationDelay=(Math.random()*0.6).toFixed(2)+'s';
    document.body.appendChild(t);setTimeout(()=>t.remove(),(d+1.2)*1000);
  }
}

        'Availability of preferred pack sizes and monthly value packs',

  why:'<b>Impulse shopper → secondary displays, checkout placement, attractive packaging.</b> The purchase is triggered by visibility, appetite or curiosity, so the lever is being seen at the right moment.<div class="work">Planned       → availability, preferred pack sizes, value packs\nDeal-seeking  → promotions, price-offs, multi-packs\nImpulse       → secondary displays, checkout placement, packaging\nConvenience   → cold cabinets, quick commerce, on-the-go packs\nBrand-loyal   → availability, quality, consistent experience</div>A price-off is the deal-seeker’s lever — the impulse shopper did not compare prices at all.<br><br>Match the lever to what <i>triggered</i> the purchase.'},

 {t:'shopper',tag:'apply',diff:'medium',
  q:'Buying a ready-to-drink coffee during a commute is the classic example of which shopper type?',
  opts:['Convenience-seeking shopper',
        'Impulse shopper',
        'Brand-loyal (Nescafé) shopper',
        'Deal-seeking shopper'],
  why:'<b>Convenience-seeking: “prioritises speed, accessibility and ease of purchase.”</b> The RTD coffee on a commute is the classic example, and the levers are cold cabinets, quick-commerce availability and on-the-go packs.<div class="work">Convenience-seeking\n  Example → RTD coffee during a commute\n  Lever   → cold cabinets, quick commerce, on-the-go packs</div>It can look like impulse, but the coffee was a <i>need</i> met quickly, not an unplanned grab triggered by a display.<br><br>Impulse is triggered by the display; convenience is triggered by the shopper’s time pressure.'},

 {t:'shopper',tag:'apply',diff:'medium',trap:true,
  q:'A shopper always buys Nescafé Classic. What is the biggest commercial risk for Nestlé with this shopper?',
  opts:['A stock-out, which forces even a loyal shopper to switch',
        'Too few price-offs, since loyal shoppers chase discounts',
        'Weak checkout placement, which loses the impulse sale',
        'A missing multi-pack, which this shopper buys every time'],
  why:'<b>Brand-loyal shopper → “maintain availability, quality and consistent brand experience”.</b> Loyalty is not bought with discounts; it is kept by never giving the shopper a reason to try the alternative.<div class="work">Brand-loyal\n  Example → consistently buying Nescafé Classic\n  Lever   → availability · quality · consistent experience</div>The trap is assuming every shopper responds to price-offs. Discounting a loyal shopper’s brand mostly gives margin away to someone who would have bought anyway.<br><br>The loyal shopper’s enemy is the empty shelf, not the competitor’s offer.'},

 {t:'shopper',tag:'concept',diff:'medium',
  q:'In the seven-step shopper journey, which stage comes straight after <b>“Navigates the store”</b>?',
  opts:['Category exploration',
        'Decision making',
        'Entry & first impressions',
        'Purchase & checkout'],
  why:'<b>The journey runs: Entry → Navigate → Category exploration → Decision → Purchase → Post-purchase → Repeat.</b><div class="work">1 Entry & first impressions\n2 Navigates the store\n3 Category exploration   ← compares brands, packs, prices\n4 Decision making\n5 Purchase & checkout\n6 Post-purchase behaviour\n7 Repeat visit</div>Decision making is one step later: first the shopper scans the category, <i>then</i> chooses.<br><br>A useful mnemonic: E-N-C-D-P-P-R — “Every New Customer Decides, Pays, Posts, Returns.”'},

 {t:'shopper',tag:'apply',diff:'hard',trap:true,
  q:'At which journey stage do eye-level placement and end caps act as <b>influencer cues</b>?',
  opts:['Decision making',
        'Category exploration',
        'Entry & first impressions',
        'Purchase & checkout'],
  why:'<b>Stage 4, Decision making:</b> “Chooses based on brand trust, price, quality, pack size, offers and influencer cues (e.g. eye-level, end caps).”<div class="work">3 Category exploration → compares brands, checks pack sizes, prices, offers\n4 Decision making      → trust, price, quality, pack, offers,\n                         influencer cues: eye-level, end caps</div>Category exploration is the tempting answer because the shopper is in front of the shelf — but the cues act at the moment of choice. Checkout is where <i>impulse</i> add-ons happen.<br><br>Exploration is comparing; decision is choosing — the cues tip the choice.'},

 {t:'shopper',tag:'apply',diff:'medium',
  q:'A shopper picks up three shampoo brands, checks the variants and compares price points before choosing. Which shopper behaviour is this?',
  opts:['Explores & compares',
        'Value seeking',
        'Brand & quality conscious',
        'Convenience driven'],
  why:'<b>Explores & compares: “checks multiple brands, variants and price points.”</b><div class="work">Value seeking          → best price, offers, pack sizes\nConvenience driven     → easy-to-find, well-stocked products\nBrand & quality        → trusted brands, familiar packs\nExplores & compares    → multiple brands, variants, price points\nImpulse buying         → displays, end caps, combos, promotions\nHealth & lifestyle     → healthier, natural, functional</div>Value seeking also involves price, but it is about finding the <i>best</i> price or offer, not about comparing across brands and variants.<br><br>Read for the verb: “compares” across options vs “looks for” the best deal.'},

 {t:'layout',tag:'apply',diff:'easy',
  q:'A grocery retailer with a very high SKU count wants maximum product density and quick everyday shopping. Which layout fits?',
  opts:['Grid layout',
        'Free-flow layout',
        'Loop / racetrack layout',
        'Spine layout'],
  why:'<b>Grid: parallel aisles, straight pathways — “efficient, organised, high capacity”.</b> It maximises space and product density and suits everyday missions.<div class="work">Grid best suited for\n  grocery · pharmacies · convenience · high-SKU formats</div>Free-flow and loop give up density for experience — fine for fashion, wasteful for 5,000 grocery SKUs. Spine suits multi-department stores rather than dense grocery.<br><br>High SKUs + everyday mission = grid, every time.'},

 {t:'layout',tag:'concept',diff:'medium',trap:true,
  q:'A retailer wants shoppers <b>guided along one defined path</b> past every category, not wandering. Which layout is it?',
  opts:['Loop / racetrack layout',
        'Free-flow layout',
        'Spine layout with one main aisle',
        'Hybrid layout'],
  why:'<b>Loop / racetrack “creates a defined path that guides shoppers around the store, exposing them to multiple product categories”.</b><div class="work">Loop      → defined path, guided exposure, discovery\nFree-flow → flexible fixtures, no rigid aisles, open wandering</div>Free-flow is the trap: both are “experiential” and both suit fashion, but free-flow deliberately has <i>no</i> set path. The defined path is the loop’s whole point.<br><br>Loop = guided. Free-flow = unguided. That is the line examiners test.'},

 {t:'layout',tag:'apply',diff:'medium',
  q:'A large electronics and home-appliances store (think Croma) wants a clear main aisle with departments branching off both sides. Which layout?',
  opts:['Spine layout',
        'Grid layout',
        'Loop / racetrack layout',
        'Free-flow layout'],
  why:'<b>Spine: “a central main aisle (spine) with product categories and departments branching off on either side.”</b> Clear path, strong structure.<div class="work">Spine best suited for\n  large-format stores · department stores\n  multi-category retailers · home improvement & electronics</div>A grid also has aisles, but they are many parallel ones of equal weight — there is no single spine.<br><br>One dominant aisle with departments off it = spine.'},

 {t:'layout',tag:'apply',diff:'medium',
  q:'A hypermarket runs grocery aisles, a fashion zone and an electronics corner under one roof. Which layout fits best?',
  opts:['Hybrid layout',
        'Grid layout',
        'Spine layout',
        'Free-flow layout'],
  why:'<b>Hybrid “combines two or more layout types — a grid for core categories and free-flow or loop elements for featured areas.”</b><div class="work">Hybrid hypermarket floor\n  Everyday essentials → grid\n  Fashion             → free-flow\n  Electronics         → loop element\nBest suited for: superstores & hypermarkets, multiple shopping missions</div>Grid alone would serve the grocery and waste the fashion zone. Spine suits departments, but a multi-mission hypermarket is the textbook hybrid.<br><br>Several shopping missions in one store = hybrid.'},

 {t:'layout',tag:'concept',diff:'medium',
  q:'What does a grid layout give up compared with a loop layout?',
  opts:['Browsing and discovery, since it is built for efficient missions',
        'Product density, since its aisles are spaced far apart from each other',
        'Ease of finding products, since its paths are curved',
        'Space efficiency, since it works only in small stores'],
  why:'<b>Grid optimises efficiency; loop optimises discovery.</b> The grid lets a shopper go straight to the aisle they need — great for a list, poor for exposing them to categories they did not plan to visit.<div class="work">Grid → efficient · organised · high capacity\nLoop → encourages discovery · engaging · experiential</div>The other options invert the grid’s strengths: it has the <i>highest</i> density, the <i>easiest</i> navigation and the <i>best</i> space use.<br><br>Every layout trades efficiency against experience — say which side it sits on.'},

 {t:'supply',tag:'concept',diff:'easy',
  q:'In the MT supply chain, which step sits between <b>MT central buying</b> and the <b>MT store</b>?',
  opts:['MT DC / warehouse — receives, stores, sorts and distributes',
        'Distributor — stores stock and services retailers across a town',
        'Retailer / kirana — stocks and sells to end consumers',
        'Manufacturer depot — dispatches direct to each store'],
  why:'<b>MT chain: Manufacturer → MT central buying → MT DC/warehouse → MT store → shopper.</b><div class="work">MT : Manufacturer → Central Buying → DC/Warehouse → Store → Shopper\nGT : Manufacturer → Distributor → Retailer/Kirana → Shopper</div>The distributor is the GT intermediary. MT replaces it with its own DC, which is why “centralised buying, DC-based distribution” is the MT tagline.<br><br>MT has a buying step GT does not; GT has a distributor MT does not.'},

 {t:'supply',tag:'concept',diff:'easy',
  q:'Which tagline describes the <b>General Trade</b> supply chain?',
  opts:['Distributor-led, decentralised and retailer-focused',
        'Centralised buying, DC-based, system-driven replenishment',
        'Platform-led, dark-store based and algorithm-driven',
        'Manufacturer-led, direct-to-store and forecast-driven'],
  why:'<b>GT: “distributor-led, decentralised and retailer-focused.”</b> <b>MT: “centralised buying, DC-based distribution and system-driven replenishment.”</b><div class="work">MT → centralised · DC-based · system-driven\nGT → distributor-led · decentralised · retailer-focused</div>The second option is the MT tagline — the most likely wrong pick. The third describes quick commerce, which the MT vs GT supply-chain comparison does not cover.<br><br>The two taglines are mirror images: learn one and invert it.'},

 {t:'supply',tag:'apply',diff:'medium',trap:true,
  q:'How is replenishment ordered for a DMart store?',
  opts:['System / central replenishment, driven by inventory and sales',
        'The store manager phones the FMCG company’s salesman every week',
        'The distributor’s salesman visits and writes the order',
        'The shopper’s app orders trigger a dark-store top-up'],
  why:'<b>MT ordering is “system / central replenishment”; the store “receives replenishment based on inventory/sales”.</b><div class="work">Ordering\n  MT → system / central replenishment\n  GT → salesman / distributor driven\nStore replenishment\n  MT → DC / system replenishes store\n  GT → distributor services outlet</div>The salesman-writes-the-order picture is GT. It is the trap because FMCG companies do still put people into MT stores — but they are promoters and merchandisers, not order-takers.<br><br>In MT the system orders; in GT a person does.'},

 {t:'supply',tag:'apply',diff:'medium',
  q:'Why can a brand measure promotion uplift far more precisely in MT than in GT?',
  opts:['MT has POS / sales data; GT data is often limited',
        'MT promotions run longer, so their effects are bigger',
        'GT promotions are illegal without a distributor',
        'MT shoppers are more responsive to every offer'],
  why:'<b>Data: MT → “POS / sales data available”; GT → “often limited”.</b> Store/SKU-level scan data lets the brand compare sales during and outside a promotion.<div class="work">Data\n  MT → POS / sales data available\n  GT → often limited</div>The same holds for national chains, which use “store/SKU-level sales, inventory, off-take and promotion data”. Measurability is the feature, not shopper responsiveness.<br><br>“System-led” in the GT/OT one-liner is largely this: decisions run on data.'},

 {t:'category',tag:'concept',diff:'easy',
  q:'How is a <b>category</b> defined in MT?',
  opts:['A group of related products that meet a similar need',
        'All the SKUs of one brand on a single shelf in-store',
        'The products a retailer buys from a single supplier',
        'A price band that groups products of similar value'],
  why:'<b>“A category is a group of related products that meet a similar need”</b> — personal care, home care, beverages, snacks.<div class="work">Category = related products × similar need\nNOT      = one brand / one supplier / one price band</div>Defining by brand or supplier is the manufacturer’s view. MT is category-led precisely because the retailer organises around the shopper’s need, not the supplier.<br><br>In MT, “categories are the navigation points for shoppers”.'},

 {t:'category',tag:'apply',diff:'medium',
  q:'Dairy and personal care are described as categories that “act as destination points”. Which benefit of category does that illustrate?',
  opts:['Drives store traffic',
        'Builds larger baskets',
        'Increases sales and share',
        'Meets shopper needs better'],
  why:'<b>Benefit 1, Drives store traffic:</b> “Key categories act as destination points (e.g. dairy, personal care).” A shopper goes to the store <i>for</i> them.<div class="work">1 Drives store traffic        → destination categories\n2 Builds larger baskets       → cross-category, add-ons, higher bill\n3 Increases sales & share     → visibility, availability\n4 Meets shopper needs better  → navigation, experience\n5 Efficient space & assortment→ right SKUs, shelf, facings\n6 Long-term partnerships      → trust, promos, growth</div>Larger baskets is the next step — once the shopper is in for milk, cross-category buying adds to the bill.<br><br>Destination = traffic. Add-on = basket.'},

 {t:'category',tag:'apply',diff:'medium',
  q:'A well-planned snacks aisle next to beverages leads shoppers to add chips to their cola. Which benefit is this?',
  opts:['Builds larger baskets',
        'Drives store traffic',
        'Enables efficient space management',
        'Supports long-term partnerships'],
  why:'<b>Builds larger baskets: “A well-planned category encourages cross-category buying … drives add-on purchases and higher average bill value.”</b><div class="work">Cola (planned) + chips (add-on) → higher average bill value</div>Traffic is about why the shopper came in; basket is about what else they leave with. Space management is about allocating SKUs, shelf and facings.<br><br>Cross-category = basket.'},

 {t:'category',tag:'calc',diff:'hard',trap:true,
  q:'Fresh foods is ranked <b>7th</b> at 10–20%; personal care is ranked <b>2nd</b> at 10–15%. What should you take from this?',
  opts:['The ranks do not follow the ranges — fresh’s midpoint, 15%, beats personal care’s 12.5%',
        'Personal care always out-sells fresh, which is why it ranks 2nd in the table',
        'Fresh foods’ range is a misprint and should read 1–2%, in line with its rank',
        'Ranks are by margin, not by sales, so the ranges and the ranks cannot be compared at all'],
  why:'<b>The table’s ranks and ranges disagree.</b> Compare midpoints:<div class="work">Personal care (rank 2)  (10 + 15) ÷ 2 = 12.5%\nFresh foods  (rank 7)  (10 + 20) ÷ 2 = 15.0%\nDairy        (rank 6)  ( 8 + 15) ÷ 2 = 11.5%\nHome care    (rank 3)  ( 8 + 12) ÷ 2 = 10.0%</div>On the table’s own numbers, fresh can be the second-largest category and dairy outranks home care. The ranges also sum to 82–139%, so they are indicative, not a split of 100.<br><br><b>In the exam:</b> quote the ranges, call them “indicative”, and do not build an argument on the rank order below #1. Nothing on the slide says the ranks are by margin — that option invents a reason.'},

 {t:'category',tag:'concept',diff:'medium',
  q:'Which benefit of category in MT is about allocating the right SKUs, shelf space and facings?',
  opts:['Enables efficient space & assortment management',
        'Meets shopper needs better',
        'Increases sales & share',
        'Supports long-term partnerships with the retailers'],
  why:'<b>Benefit 5: “Helps allocate the right SKUs, shelf space and facings; improves productivity of the store and the sales team.”</b><div class="work">5 Efficient space & assortment → SKUs · shelf space · facings · productivity</div>“Increases sales & share” is about visibility and availability for the <i>brand</i>; benefit 5 is about the retailer’s <i>space</i> productivity.<br><br>Facings and shelf space → space management.'},

 {t:'construct',tag:'apply',diff:'medium',
  q:'A chain with <b>40 stores</b> wants to list your brand. Who decides and how do you work with them?',
  opts:['Central buyer + regional teams; regional negotiation, centralised listing',
        'Store owner; a direct store-level relationship, store by store',
        'Owner / small buying team; direct negotiation, store-wise execution',
        'Central category team; national agreements and a centralised promotions calendar'],
  why:'<b>10–100 stores = regional chain: central buyer + regional teams; regional negotiations, centralised listing.</b><div class="work">Construct            Stores    Decision maker              FMCG approach\nSingle store         1         Store owner                 Direct store-level relationship\nSmall chain          2–10      Owner / small buying team   Direct negotiation + store-wise execution\nRegional chain       10–100    Central buyer + regional    Regional negotiations, centralised listing\nLarge regional/nat.  100–500   Central category/procurement Central listing + region/store execution\nNational / pan-India 500+      Central buying + cat. mgmt  National agreements, centralised promotions</div>40 stores is past the owner-run stage but well short of national.<br><br>Read the store count, then walk the row: decision maker → approach.'},

 {t:'construct',tag:'concept',diff:'easy',
  q:'What is the typical store-area range for a <b>national hypermarket chain</b> such as DMart or Reliance Smart Bazaar?',
  opts:['30,000–1,00,000+ sq ft',
        '2,000–15,000 sq ft',
        '1,000–5,000 sq ft',
        '50,000–2,00,000+ sq ft'],
  why:'<b>National hypermarkets: 30,000–1,00,000+ sq ft</b> (DMart, Reliance Smart Bazaar, Spencer’s).<div class="work">Hypermarket chains  30,000–1,00,000+  DMart · Smart Bazaar · Spencer’s\nSupermarket chains   2,000–15,000     Nature’s Basket · More · Star Bazaar\nCash & carry        30,000–1,00,000+  METRO\nLulu (regional)     50,000–2,00,000+\nNilgiris             1,000–5,000</div>2,000–15,000 is the supermarket band; 50,000–2,00,000+ is Lulu specifically.<br><br>Hypermarket and cash & carry share a size band — what separates them is the customer (shopper vs business).'},

 {t:'construct',tag:'apply',diff:'medium',
  q:'National MT chains work with FMCG companies through which relationship model?',
  opts:['Joint Business Planning (JBP), not transactional selling',
        'Transactional selling, order by order through the whole year',
        'Owner-led negotiation with quick, informal decisions',
        'Distributor-led servicing with local credit terms'],
  why:'<b>Relationship model: “Joint Business Planning (JBP) rather than transactional selling.”</b> Brand and retailer set joint growth targets, promotion calendars and investment for the year.<div class="work">National chain ways of working\n  Buying      → centralised national/category teams\n  Negotiation → annual / periodic, national or regional\n  Promotions  → annual promotion calendar\n  Review      → regular business reviews: sales, growth, availability, ROI\n  Relationship→ JBP rather than transactional selling</div>Owner-led, quick decisions is how <i>regional</i> chains work. Distributor-led servicing is GT.<br><br>Scale makes the relationship a plan, not a series of orders.'},

 {t:'construct',tag:'apply',diff:'hard',trap:true,
  q:'Lulu Hypermarket runs 50,000–2,00,000+ sq ft stores, yet it is classed as a <b>regional</b> MT chain. How do you reconcile this?',
  opts:['Construct (reach) and format (store size) are separate axes',
        'It is an error — any hypermarket must be a national chain',
        'Store size decides the construct, so Lulu is national',
        'Regional chains are defined by store size under 15,000 sq ft'],
  why:'<b>Construct and format answer different questions.</b> Construct (single, regional, national) is about <i>reach and who decides</i>. Format (hyper, super, mini, cash & carry) is about <i>store size and offer</i>.<div class="work">Lulu       → format: hypermarket · construct: regional (selected cities)\nNilgiris   → format: supermarket · construct: regional (South India)\nDMart      → format: hypermarket · construct: national</div>The trap is assuming big stores mean a national chain. A regional chain can run hypermarkets; a national chain can run 1,000 mini stores.<br><br>Always classify a retailer on both axes.'},

 {t:'construct',tag:'apply',diff:'medium',
  q:'How does a <b>regional</b> MT chain differ from a <b>national</b> one?',
  opts:['More scope for regional assortment and local festival campaigns',
        'More standardised core assortment and national promotion calendars',
        'More formal, structured business reviews across every chain',
        'More large-scale volume and reach than a national chain has'],
  why:'<b>Regional chains: regional/owner-led buying, regional assortment, local festivals, reviews that vary by chain capability, strong local presence.</b><div class="work">National                      Regional\nNational/category buying      Regional buyers / owner-led\nStandardised core assortment  Greater scope for regional assortment\nNational promo calendars      Regional festivals, local campaigns\nFormal structured reviews     Reviews vary by size/capability\nLarge-scale volume and reach  Strong local presence, shopper insight</div>The other three options are all national-chain traits, reworded.<br><br>Regional wins on local relevance and speed; national wins on scale and structure.'},

 {t:'construct',tag:'apply',diff:'medium',
  q:'Why does a cash & carry (e.g. METRO) price differently from a hypermarket?',
  opts:['Net prices must leave room for downstream retailers to earn a margin',
        'It sells to end shoppers, so it matches the lowest MRP in its catchment area',
        'It runs on JBPs, so the FMCG company sets the shelf price itself',
        'It stocks premium imported brands, so it prices at a premium'],
  why:'<b>Cash & carry sells B2B</b> — to kiranas, food service and other businesses. Its pricing must be “competitive net purchase prices that allow downstream retailers to earn a margin”.<div class="work">Cash & carry\n  Customers   → kiranas, food service, other B2B\n  Assortment  → high-rotation SKUs, bulk packs, case sizes\n  Promotions  → volume discounts, slab schemes, bulk deals\n  Supply      → pallet/carton movement, high fill rates\n  Metrics     → volume/value, gross margin, stock turns,\n                availability, customer penetration</div>The second option describes a consumer retailer. Cash & carry’s customer resells the product, so it needs headroom to MRP.<br><br>In cash & carry the shopper is a business — every row follows from that.'},

 {t:'construct',tag:'apply',diff:'medium',
  q:'Which set of levers best fits a <b>mini supermarket</b> chain (e.g. Reliance Smart Point)?',
  opts:['Small packs, impulse lines, checkout displays and chillers',
        'Bulk packs, case sizes and volume slab schemes for business',
        'Premium imported brands, testers and beauty advisors on-floor',
        'Annual national calendars and a JBP with category management'],
  why:'<b>Mini supermarkets: limited shelf space, frequent small-basket shopping.</b><div class="work">Assortment  → small packs, impulse, daily essentials, beverages, snacks\nVisibility  → checkout displays, counter-top units, shelf strips,\n              eye-level placement, chillers\nSupply      → frequent replenishment in small quantities\nMetrics     → sales per sq ft, SKU productivity, stock-outs,\n              stock turns, repeat purchase</div>Bulk packs are cash & carry; testers and advisors are beauty retail; JBP and national calendars are the national hypermarket.<br><br>Small store, small basket, small pack — and sales per square foot is the metric.'},

 {t:'construct',tag:'concept',diff:'medium',trap:true,
  q:'Which type of MT chain can have the <b>widest</b> store network?',
  opts:['Convenience / mini-supermarket chains, at 10–1,000+ stores',
        'National / large hypermarket chains, at 100+ stores',
        'Supermarket chains such as More, at 20–500+ stores in their network',
        'Cash & carry / wholesale chains, at 20–100+ stores'],
  why:'<b>Convenience / mini-supermarket chains: 10–1,000+ stores</b> (Reliance Smart Point, Spencer’s Local). Small stores, many of them.<div class="work">National / large hypermarket   100+\nSupermarket chains             20–500\nRegional MT chains             10–100+\nCash & carry / wholesale       20–100+\nConvenience / mini-supermarket 10–1,000+</div>The trap is equating big stores with a big network. Hypermarkets are large but expensive to open; mini formats scale by number.<br><br>Note: the store-count construct table puts a national chain at 500+ stores, while the format summary puts national hypermarkets at 100+. Quote the table the question refers to.'},

 {t:'specialty',tag:'concept',diff:'easy',
  q:'What is the typical assortment of a pharmacy retail chain?',
  opts:['Medicines + OTC + personal care + wellness + nutrition + selected FMCG',
        'Prescription medicines only, with no FMCG or personal-care range at all',
        'Makeup, skincare, haircare and fragrance with premium international labels',
        'High-rotation bulk packs and case sizes for clinics and hospital buyers'],
  why:'<b>Pharmacy assortment: medicines + OTC + personal care + wellness + nutrition + selected FMCG.</b> That is exactly why pharmacy is an MT channel for FMCG companies.<div class="work">FMCG opportunity in pharmacy\n  OTC · personal care · oral care · skincare · baby care\n  nutrition · hygiene · wellness</div>“Medicines only” describes an old-style chemist. The makeup list is the beauty retailer’s assortment.<br><br>Pharmacy = health trust + FMCG adjacency.'},

 {t:'specialty',tag:'concept',diff:'medium',
  q:'What data does a pharmacy chain track that a grocery chain would not?',
  opts:['The prescription / OTC mix',
        'Promotion uplift store by store',
        'SKU sales and inventory',
        'Store-level productivity'],
  why:'<b>Pharmacy data: “SKU sales, inventory, prescription/OTC mix, customer purchase and store productivity.”</b> The Rx/OTC mix is unique to the channel.<div class="work">Pharmacy data → SKU sales · inventory · prescription/OTC mix\n                customer purchase · store productivity</div>The other three are tracked by every organised chain.<br><br>For an FMCG brand, a high OTC share signals a store where self-selected health products sell.'},

 {t:'specialty',tag:'concept',diff:'medium',
  q:'Which chain is India’s <b>second-largest</b> pharmacy retailer, with 5,500+ stores in 800+ cities?',
  opts:['MedPlus',
        'Apollo Pharmacy',
        'Guardian Pharmacy',
        'Wellness Forever'],
  why:'<b>MedPlus Health Services: second-largest, 5,500+ stores, 800+ cities</b> — selling medicines, FMCG and opticals.<div class="work">Largest       → Apollo Pharmacy (Apollo Hospitals Enterprise)\nSecond-largest→ MedPlus (5,500+ stores, 800+ cities)</div>Apollo is the largest. Guardian and Wellness Forever are smaller, regionally concentrated chains.<br><br>Learn Apollo and MedPlus as a pair.'},

 {t:'specialty',tag:'apply',diff:'medium',
  q:'Which visibility levers belong to a beauty retailer, as opposed to a grocery chain?',
  opts:['Brand bays, shop-in-shops, testers and digital screens',
        'End caps, gondola ends and secondary displays in aisles',
        'Checkout displays, counter-top units and shelf strips',

function sceneNode(s){

function mcqNode(Q,card,onScore){
  const box=el('div','mcq');
  const tagLb={apply:'⚙ Apply',case:'🏷 Case',calc:'🧮 Calculate',concept:'◈ Concept'};
  let head='<span class="tag '+Q.tag+'">'+(tagLb[Q.tag]||'◈ Concept')+'</span>';
  if(Q.diff)head+='<span class="tag '+Q.diff+'">'+Q.diff+'</span>';
  if(Q.trap)head+='<span class="tag trap">🃏 tricky</span>';
  box.innerHTML=head+'<div class="q">'+Q.q+'</div>';
  if(Q.given)box.appendChild(el('div','givens',Q.given.map(g=>'<span>'+g+'</span>').join('')));
  const opts=el('div','opts');box.appendChild(opts);
  const letters=['A','B','C','D','E'],order=shuffle(Q.opts.map((o,i)=>({o,i})));let done=false;
  order.forEach((item,pos)=>{
    const b=el('button','opt','<span class="lt">'+letters[pos]+'</span>'+item.o);
    b.onclick=e=>{
      if(done)return;done=true;box.dataset.done='1';const ok=item.i===0;
      [...opts.children].forEach((c,j)=>{c.disabled=true;
        if(order[j].i===0)c.classList.add('correct');else if(j===pos)c.classList.add('wrong');else c.classList.add('dim');});
      onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
      const why=el('div','why','<h5>'+(ok?'Why this is right →':'Why the answer is what it is →')+'</h5><p>'+Q.why+'</p>');
      box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
    };
    opts.appendChild(b);});
  return box;
}
/* a written question — used by the exam caselets and by the written paper */
function openNode(Q,label,idx,onOpen){
  const card=el('div','openq');
  card.innerHTML='<div class="oh"><span class="on">'+label+'</span><span class="om">'+(Q.marks||5)+' marks</span></div>'+
    '<div class="oq">'+Q.q+'</div>'+(Q.hint?'<p class="hint">💡 '+Q.hint+'</p>':'');
  const ansBox=el('div','ans');
  ansBox.innerHTML='<h5>Model answer</h5>'+(Q.svg&&typeof dsSvg==='function'?dsSvg(Q.svg):'')+Q.ans+
    (Q.rubric?'<div class="rub"><h6>Marking scheme — what the examiner wants</h6><ul>'+
      Q.rubric.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>':'');
  const btn=el('button','btn btn-grad btn-rev','Show model answer ↓');
  btn.onclick=()=>{
    const open=ansBox.classList.toggle('show');
    btn.textContent=open?'Hide model answer ↑':'Show model answer ↓';
    if(open&&!OPENED[idx]){OPENED[idx]=1;buildSidebar();onOpen&&onOpen();}
  };
  card.appendChild(btn);card.appendChild(ansBox);
  return card;
}

/* ---------- keyboard: answer the first unanswered question ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||'')))return;
  if($('#badgeOvl')||$('#cmapOvl'))return;
  const map={'1':0,'2':1,'3':2,'4':3,'5':4,'a':0,'b':1,'c':2,'d':3,'e':4};
  const idx=map[(e.key||'').toLowerCase()];
  if(idx===undefined)return;
  const box=[...document.querySelectorAll('.mcq')].find(b=>!b.dataset.done);
  if(!box)return;
  const btn=box.querySelectorAll('.opt')[idx];
  if(!btn||btn.disabled)return;
  e.preventDefault();
  btn.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});
  btn.click();
});

        quizState.answered++;quizState.per[q.t].a++;
        if(ok){quizState.correct++;quizState.per[q.t].c++;if(q.trap)quizState.traps++;}
        else quizState.missed.push(q);
        const p=quizState.per[q.t];
        if(p.a===p.n&&p.c===p.n&&TBADGE[q.t])unlock(TBADGE[q.t]);
        if(TRAPS&&quizState.traps===TRAPS)unlock('b_trap');
        buildSidebar();updateFoot();}));
      m.appendChild(card);});
  });
  const rc=el('div','card hidden');rc.id='resultsCard';m.appendChild(rc);
  buildFoot();buildSidebar();
}

function calcNode(kind,title){
  const C=D_CALCS[kind]; if(!C)return el('div');
  const box=el('div','calc');
  box.innerHTML='<h4>⚡ '+title+'</h4><p class="hint">'+C.hint+'</p>';
  const inWrap=el('div','cin'), out=el('div','cout');
  const state={}; C.ins.forEach(i=>state[i.k]=i.def);
  const redraw=()=>{out.innerHTML=C.run(state);};
  C.ins.forEach(i=>{
    const lab=el('label');
    lab.innerHTML='<span class="nm">'+i.nm+'</span>';
    let inp,val=null;
    if(i.type==='select'){
      inp=el('select');
      inp.style.cssText='flex:2 1 170px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;font-family:inherit;font-size:13.5px;padding:7px 10px';
      i.opts.forEach(([v,lbl])=>{const o=el('option',null,lbl);o.value=v;inp.appendChild(o);});
      inp.value=i.def;
      inp.onchange=()=>{state[i.k]=inp.value;redraw();};
    } else {
      inp=el('input');
      inp.type=i.type==='range'?'range':'number';
      if(i.type==='range'){inp.min=i.min;inp.max=i.max;inp.step=i.step;}
      inp.value=i.def;
      val=i.type==='range'?el('span','val',String(i.def)):null;
      inp.oninput=()=>{const raw=parseFloat(inp.value);state[i.k]=isNaN(raw)?0:raw;if(val)val.textContent=String(state[i.k]);redraw();};
    }
    lab.appendChild(inp); if(val)lab.appendChild(val);
    inWrap.appendChild(lab);
  });
  box.appendChild(inWrap);box.appendChild(out);redraw();
  return box;
}

    core.onclick=()=>setScope('core');list.appendChild(core);

    all.innerHTML='<span class="idx">∞</span><span class="nm">Everything<small>'+D_QUIZ.length+' questions · adds the deep cuts</small></span>';
    all.onclick=()=>setScope('all');list.appendChild(all);

    all.innerHTML='<span class="idx">◎</span><span class="nm">All sections<small>'+D_QUIZ.length+' questions · full paper</small></span>';
    all.onclick=()=>setScope('all');list.appendChild(all);
  }

    const inScope=ACTIVE.some(q=>q.t===t.id);
    const p=quizState?quizState.per[t.id]:{c:0,n:0,a:0};
    const n=inScope?p.n:D_QUIZ.filter(q=>q.t===t.id).length;
    const d=el('div','topic'+(inScope&&p.a===p.n&&p.n?' done':'')+(t.hot?' hot':'')+(FOCUS===t.id?' on':'')+(inScope?'':' off'));
    d.innerHTML='<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+

function grade(p){
  if(p>=90)return['Outstanding — exam-ready! 🏆','var(--lime)'];
  if(p>=75)return['Strong pass — polish the weak spots. ✅','var(--cyan)'];
  if(p>=60)return['Decent — a focused review will lift this. 📈','var(--gold)'];
  return['Keep going — reread the Why panels and retake. 🔁','var(--red)'];
}
function showResults(){
  const s=scored();if(!s)return;
  const{correct,total,per}=s,pct=Math.round(correct/total*100);
  MISSED=s.missed.slice();
  if(pct>=75)unlock('b_quiz75'); if(pct===100)unlock('b_perfect');
  const rc=$('#resultsCard');rc.className='card';rc.innerHTML='';
  rc.appendChild(el('div',null,'<div class="eyebrow">Results</div><h1 class="tt">Paper complete</h1>'));

  rw.innerHTML='<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200">'+
    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>'+
    '<circle id="ringArc" cx="100" cy="100" r="'+R+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/>'+
    '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs></svg>'+
    '<div class="mid"><div class="big" id="ringPct">0%</div><div class="sm">'+correct+' / '+total+'</div></div></div>';
  const g=grade(pct),gs=el('div');
  gs.innerHTML='<div class="grade" style="color:'+g[1]+'">'+g[0]+'</div><div class="sub">You answered '+correct+' of '+total+' correctly · longest streak <b>'+G.best+'</b> · tricky questions cleared <b>'+s.traps+'</b>.</div>';
  rw.appendChild(gs);rc.appendChild(rw);
  const meters=el('div','meters');let weak=null;

    ? D_CASES.map(c=>({id:c.id,name:c.cl+' · '+c.title.split('—')[0].trim(),p:per[c.id]}))
    : D_TOPICS.map(t=>({id:t.id,name:t.name,p:per[t.id]}));
  rows.forEach(r=>{const p=r.p;if(!p||!p.n)return;const ratio=p.c/p.n;

    rc.appendChild(w);}
  const row=el('div','row-btns');

    const dr=el('button','btn btn-grad','🎯 Drill the '+MISSED.length+' I missed');
    dr.onclick=()=>setScope('missed');row.appendChild(dr);
  }
  const rt=el('button','btn '+(MODE==='drill'&&MISSED.length?'btn-ghost':'btn-grad'),'↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{MODE==='exam'?renderExam():renderDrill();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  row.appendChild(rt);

    const arc=$('#ringArc');arc.style.transition=reduced?'none':'stroke-dashoffset 1.1s var(--spring)';
    arc.style.strokeDashoffset=C*(1-pct/100);
    meters.querySelectorAll('.bar i').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.w+'%',reduced?0:120+i*80));
    const node=$('#ringPct');

    else{const t0=performance.now();(function tk(now){const p=Math.min(1,(now-t0)/1100);node.textContent=Math.round(pct*p)+'%';if(p<1)requestAnimationFrame(tk);})(t0);}
  });
  const wb=$('#goWeak');if(wb)wb.onclick=()=>setScope('topic',weak.id);
  if(pct>=75){sfxFanfare();confetti(140);crackers(innerWidth*0.5,innerHeight*0.38,14);mega(pct===100?'👑':'🎉',true);bigCall(pct===100?'FLAWLESS! 👑':'WELL PLAYED! 🎉');}
  else{sfxSad();mega('😬',false);}

  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* ---------- the map (cheat-sheet) ---------- */
$('#hMap').onclick=()=>{
  if(!D_CMAP.length||$('#cmapOvl'))return;
  const ovl=el('div','ovl');ovl.id='cmapOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Reference</div><h1 class="tt">'+(CFG.mapTitle||'The Map')+' 📋</h1>'+
    '<div class="sub">'+(CFG.mapIntro||'The whole course on one page. <b>Bold</b> marks the bit that usually carries the mark; the blocks marked ★ are the ones worth reading last, on the morning of the paper.')+'</div>';
  D_CMAP.forEach(b=>{
    const blk=el('div','cm-block');
    blk.innerHTML='<h4>'+b.h+'</h4><p class="cm-note">'+b.note+'</p>';
    const sc=el('div','cm-scroll');
    const cells=b.rows.map(r=>r.filter(c=>c!=='')), cols=Math.max(...cells.map(r=>r.length));
    sc.innerHTML='<table><tbody>'+cells.map(r=>
      '<tr>'+r.map((c,i)=>{
        const span=(i===r.length-1&&r.length<cols)?' colspan="'+(cols-i)+'"':'';
        return '<td'+span+'>'+c+'</td>';
      }).join('')+'</tr>').join('')+'</tbody></table>';
    blk.appendChild(sc);card.appendChild(blk);
  });
  const row=el('div','row-btns');
  const bk=el('button','btn btn-grad','← Back');const close=()=>ovl.remove();
  bk.onclick=close;row.appendChild(bk);card.appendChild(row);
  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* =========================================================================
   OPTIONAL HELPER · supply & demand diagram for written answers
   Use in a PAPER or open question as   svg:{d:0.2,s:-0.3,cap:'…'}
   d / s  = shift size, positive = rightward.   line:{p,label} draws a
   price ceiling or floor and marks the Qd / Qs gap.
   ========================================================================= */
function dsSvg(o){
  const W=430,H=300,X0=56,X1=390,Y0=34,Y1=250;
  const mx=q=>X0+q*(X1-X0), my=p=>Y1-p*(Y1-Y0);
  const dP=(q,d)=>0.9-0.8*q+d, sP=(q,s)=>0.1+0.8*q-s;
  const eq=(d,s)=>{const q=(0.8+d+s)/1.6;return{q,p:0.1+0.8*q-s};};
  const line=(f,a)=>'M '+mx(0)+' '+my(f(0,a))+' L '+mx(1)+' '+my(f(1,a));
  const d=o.d||0, s=o.s||0, e0=eq(0,0), e1=eq(d,s);
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="Supply and demand diagram">'+
    '<defs><clipPath id="cp'+(dsSvg.n=(dsSvg.n||0)+1)+'"><rect x="'+X0+'" y="'+Y0+'" width="'+(X1-X0)+'" height="'+(Y1-Y0)+'"/></clipPath></defs>'+
    '<g clip-path="url(#cp'+dsSvg.n+')">';
  g+='<path d="'+line(dP,0)+'" stroke="#22D3EE" stroke-width="2.4" fill="none"/>'+
     '<path d="'+line(sP,0)+'" stroke="#FBBF24" stroke-width="2.4" fill="none"/>';
  if(d)g+='<path d="'+line(dP,d)+'" stroke="#22D3EE" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  if(s)g+='<path d="'+line(sP,s)+'" stroke="#FBBF24" stroke-width="2.4" fill="none" stroke-dasharray="7 5"/>';
  const dot=(q,p,c,r)=>'<circle cx="'+mx(q)+'" cy="'+my(p)+'" r="'+(r||5)+'" fill="'+c+'"/>';
  const dash=(q,p,c)=>'<path d="M '+X0+' '+my(p)+' L '+mx(q)+' '+my(p)+' L '+mx(q)+' '+Y1+'" stroke="'+c+'" stroke-width="1.2" stroke-dasharray="3 4" fill="none" opacity=".6"/>';
  if(o.line){
    const lp=o.line.p, qd=(0.9-lp)/0.8, qs=(lp-0.1)/0.8;
    g+='<path d="M '+X0+' '+my(lp)+' L '+X1+' '+my(lp)+'" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="8 4" fill="none"/>'+
       '<path d="M '+mx(Math.min(qd,qs))+' '+my(lp)+' L '+mx(Math.max(qd,qs))+' '+my(lp)+'" stroke="#FB7185" stroke-width="7" opacity=".3" fill="none"/>'+
       dot(qs,lp,'#FB7185',4)+dot(qd,lp,'#FB7185',4)+
       '<text x="'+mx(qs)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qs</text>'+
       '<text x="'+mx(qd)+'" y="'+(my(lp)+20)+'" fill="#FB7185" font-size="11" text-anchor="middle">Qd</text>';
  }
  g+=dash(e0.q,e0.p,'#9AA6C9')+dot(e0.q,e0.p,'#E7ECFF');
  if(d||s)g+=dash(e1.q,e1.p,'#4ADE80')+dot(e1.q,e1.p,'#4ADE80',6);
  g+='</g>';
  g+='<path d="M '+X0+' '+Y0+' L '+X0+' '+Y1+' L '+X1+' '+Y1+'" stroke="#9AA6C9" stroke-width="1.6" fill="none"/>'+
     '<text x="'+(X0-8)+'" y="'+(Y0+10)+'" fill="#9AA6C9" font-size="12" text-anchor="end">P</text>'+
     '<text x="'+X1+'" y="'+(Y1+20)+'" fill="#9AA6C9" font-size="12" text-anchor="end">Q</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,0))-8)+'" fill="#22D3EE" font-size="12" text-anchor="end">D</text>'+
     '<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,0))+16)+'" fill="#FBBF24" font-size="12" text-anchor="end">S</text>';
  if(d)g+='<text x="'+(mx(1)-4)+'" y="'+(my(dP(1,d))+(d>0?-8:16))+'" fill="#22D3EE" font-size="12" text-anchor="end">D₂</text>';
  if(s)g+='<text x="'+(mx(1)-4)+'" y="'+(my(sP(1,s))+(s>0?16:-8))+'" fill="#FBBF24" font-size="12" text-anchor="end">S₂</text>';
  if(o.line)g+='<text x="'+(X0+8)+'" y="'+(my(o.line.p)-8)+'" fill="#FB7185" font-size="12">'+o.line.label+'</text>';
  g+='</svg>';
  return '<div class="dsg">'+g+'<div class="cap">'+(o.cap||'')+'</div></div>';
}

/* ---------- init ---------- */
if(!D_CMAP.length)$('#hMap').style.display='none';
renderModeToggle();
$('#sideH').textContent=(MODES.find(x=>x.id===MODE)||{}).side||'Sections';
renderHUD();
if(MODE==='exam')renderExam(); else if(MODE==='learn')renderLearn(); else if(MODE==='paper')renderPaper(); else renderDrill();
</script>
